:root{--bg:#fbf1e4;--surface:#fff9f0;--surface2:#f5e6d2;--ink:#352216;--ink2:#594638;--muted:#8c7866;--green:#503021;--green2:#f1decb;--orange:#b07b46;--border:#e7d5be;--shadow:0 5px 23px rgba(62,32,17,.10);--r:15px;--espresso:#4a2717;--coffee:#392014;--coffee2:#6e472f;--soft:#f5e4cf}

.brand-title{color:#f9e7d2;font-size:clamp(17px,2vw,27px);letter-spacing:-.6px;white-space:nowrap}

.nav{gap:2px;overflow-y:auto;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:#795440 transparent}

.nav-collections>div{color:#d0a789;font-size:10px;letter-spacing:.10em;padding:0 10px 7px}
.nav-collections button{width:100%}
.nav-collections small{margin-left:auto;background:#74513b;border-radius:20px;padding:0 8px;font-size:10px}
.side-note{background:#754a32;color:#fff5e5;border:1px solid #be8f71;border-radius:10px;padding:11px;text-align:center;font-size:12px;line-height:1.3;cursor:pointer}
.side-note strong{color:#fff9ef;margin:0;font-size:12px}
.side-note:hover{background:#8b593f}
.main{max-width:1550px;padding:23px clamp(17px,1.6vw,31px) 80px}
.eyebrow{color:#8d6347;letter-spacing:.13em;font-size:10px}
.btn{border-radius:9px;padding:10px 15px;font-size:12px;gap:8px}
.btn.primary{background:#57311f;color:#fff8ec}
.btn.primary:hover{background:#6c4029}
.btn.secondary{background:#eedbc4;color:#4c2c1b}
.btn.outline{background:#fff8ed;border-color:#dbc5ac;color:#4e3123}
.btn.danger{background:#f8e7de;color:#953d27}
.btn svg{width:16px;height:16px}
.chip.active{background:#633924;border-color:#633924}
.chip,.mini-badge{background:#f0dfc9;color:#63462e;border:1px solid #e9d6bc}
.mini-badge.alt{background:#f3dfc7;color:#775030}
.recipe-card,.panel,.stat,.form-block{background:#fff8ef;border-color:#e3ceb5;box-shadow:0 3px 15px #5d331008}
.card-img{background:linear-gradient(140deg,#f0debc,#f9ebd5)}
.stat .num{color:#4d2c1b}
.search input{background:#fff6eb;border-color:#e1ccb3}
.sheet,.sheet-content{background:#fbf1e4}
.sheet-top{background:#fff8ee;border-bottom-color:#e2ccb5}
.form-block h3{color:#462619;font-size:22px}
.field label,.field-title{color:#583b28}
.text-input,textarea,select.form-select{background:#fffcf7;border-color:#deccb6;color:#352216}
.text-input:focus,textarea:focus,select.form-select:focus{border-color:#946a4e;box-shadow:0 0 0 3px #946a4e20}
.photo-drop,.add-multi-photo{background:#f7ead8;border-color:#cfae8b;color:#5b3825}
.group-card,.step-card{background:#fffcf5;border-color:#ddc9ad}
.check-pill.active{background:#563321;color:white;border-color:#563321}
.tag,.tag-suggest button{background:#f2e1cc;color:#543726;border-color:#dec6ad}
.toast{background:#4c2b1a}
.callout{background:#f3e6d6;border-color:#9c6544;color:#503525}
/* Breadcrumb and hero, matched to the supplied desktop design */
.recipe-detail{width:100%;margin:0 auto}
.detail-breadcrumb{display:flex;align-items:center;gap:10px;min-height:31px;margin:-4px 0 17px;color:#634a3b;font-size:12px}
.crumb-back{border:0;background:transparent;color:#513221;display:flex;align-items:center;gap:5px;padding:5px 4px;font-size:12px}
.crumb-back svg{width:15px;height:15px}
.crumb-sep{color:#a78c74;font-size:19px}
.crumb-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:35vw}
.crumb-search{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:180px;background:#fff7ed;border:1px solid #dfc7aa;border-radius:10px;color:#826550;padding:9px 14px;font-size:12px}
.crumb-search svg{width:16px;height:16px}
.detail-hero{display:grid;grid-template-columns:minmax(210px,34%) minmax(0,1fr);gap:clamp(14px,2vw,25px);align-items:start;margin-bottom:15px}
.hero-photo{min-width:0}
.hero-photo .view-photo{height:clamp(160px,16.5vw,280px);border-radius:12px;box-shadow:0 2px 7px #2e1d131c;background:linear-gradient(145deg,#e6bf91,#f6e7cf)}
.hero-photo .view-photo span{font-size:70px}
.hero-photo .photo-detail-thumbs{margin-top:5px;display:flex;gap:6px;overflow-x:auto}
.hero-photo .photo-detail-thumbs button{width:42px;height:35px;flex:none;border-radius:5px}
.detail-hero-copy{position:relative;min-width:0;padding-top:8px;padding-right:0}
.detail-hero-copy .eyebrow{font-size:9px;margin-bottom:5px;color:#9e785e}
.detail-hero-copy h1{font-size:clamp(26px,3vw,42px);margin:4px 0 8px;line-height:1.12;color:#47281b;letter-spacing:-.6px;max-width:calc(100% - 120px)}
.recipe-description{font-size:13px;line-height:1.4;max-width:700px;min-height:8px;margin:5px 0 12px}
.hero-actions{position:absolute;right:0;top:4px;display:flex;align-items:center;gap:6px;z-index:1}
.hero-actions .btn{font-size:12px;padding:9px 12px}
.hero-icon-button{background:#fff8eb;border:1px solid #dcc5a9;color:#69452c;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.hero-icon-button svg{width:17px;height:17px}
.hero-icon-button.is-favorite{color:#a44e2e;background:#fae8d6}
.hero-stats{display:flex;flex-wrap:wrap;margin:11px 0 12px;gap:0}
.hero-stats>div{display:flex;align-items:center;gap:9px;padding:0 17px;border-right:1px solid #dfcbb3;min-height:37px;font-size:10px;color:#725542}
.hero-stats>div:first-child{padding-left:0}
.hero-stats>div:last-child{border-right:0}
.hero-stats svg{width:23px;height:23px;color:#68412d}
.hero-stats span{display:flex;flex-direction:column;gap:0}
.hero-stats strong{font-size:12px;font-weight:700;color:#3e2619;white-space:nowrap}
.hero-categories{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.hero-categories .mini-badge{border-radius:16px;padding:4px 9px}
/* panels */
.detail-columns{display:grid;grid-template-columns:minmax(230px,34%) minmax(0,1fr);gap:12px;align-items:stretch}
.recipe-panel{background:#fff8ed;border:1px solid #dfc8ae;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #3f210c12;min-width:0}
.recipe-panel-bar{background:linear-gradient(0deg,#54301e,#472819);color:#fef0dc;display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:40px}
.recipe-panel-bar>svg{width:19px;height:19px;flex:none}
.recipe-panel-bar h2{font-family:Georgia,serif;margin:0;line-height:1.1;font-size:clamp(15px,1.47vw,20px);letter-spacing:-.15px;color:#fff9ec}
.recipe-panel-bar>button{display:grid;place-items:center;background:none;color:#f8e9d6;margin-left:auto;padding:0;min-width:24px;height:25px}
.recipe-panel-bar>button svg{width:17px;height:17px}
.recipe-panel-body{padding:12px 12px 15px}
.serving-inline{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:9px;color:#7f6652;font-size:11px}
.serving-adjust{padding:2px;gap:5px;background:#f5e6d5;border-radius:9px}
.serving-adjust button{width:24px;height:24px;border-radius:6px;font-size:15px}
.serving-adjust strong{font-size:11px;min-width:61px;text-align:center;color:#54331e}
.detail-ingredient-group{background:#fff9f0;border:1px solid #eedcc7;border-radius:9px;padding:8px;margin-bottom:10px}
.detail-ingredient-group:last-child{margin-bottom:0}
.ingredient-section-head{font-family:Georgia,serif;background:#f0dec6;color:#51331e;padding:7px 10px;border-radius:6px;margin:0 0 7px;font-size:15px}
.amount-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 1px;border-bottom:0;color:#32241c;font-size:12px;line-height:1.25}
.ingredient-check{display:flex;align-items:center;gap:7px;flex:1;cursor:pointer}
.ingredient-check input{width:13px;height:13px;flex:none;accent-color:#6c462e;margin:0}
.ingredient-check input:checked+span{text-decoration:line-through;color:#aa8c76}
.amount-list .amt{font-weight:650;font-size:11px;color:#63442b}
/* cooking steps */
.prep-steps{display:grid;gap:8px}
.prep-step{display:grid;grid-template-columns:25px minmax(64px,95px) minmax(0,1fr) minmax(73px,107px);gap:9px;align-items:center;background:#fff8ed;border:1px solid #ead8c2;border-radius:10px;padding:9px 10px}
.step-index{background:#58311f;color:#fff4e4;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:14px;font-weight:700;width:24px;height:24px;align-self:start;margin-top:2px}
.step-visual{width:100%;height:72px;display:grid;place-items:center;background:#f1dfc8;border-radius:8px;overflow:hidden;color:#885e3d}
.step-visual img{width:100%;height:100%;object-fit:cover}
.step-visual svg{width:34px;height:34px}
.step-info h4{font-family:Georgia,serif;font-size:14px;color:#402617;margin:0 0 3px;line-height:1.1}
.step-info p{font-size:11px;line-height:1.43;margin:0;color:#4a382c}
.step-meta{display:grid;gap:5px;padding-left:8px;border-left:1px solid #ead9c2;align-self:stretch;align-content:center}
.step-meta span{display:flex;align-items:center;gap:5px;font-size:10px;color:#573d2b;line-height:1.2}
.step-meta svg{width:14px;height:14px;flex:none}
.cook-note{background:#f6e9d7;border-radius:6px;padding:5px 7px;margin-top:5px;font-size:10px;color:#6c4a31;line-height:1.3}
.cook-note strong{font-weight:700}
/* bottom cards */
.detail-lower{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.detail-lower .recipe-panel-body{min-height:108px;padding:12px}
.detail-lower .recipe-panel-bar h2{font-size:clamp(13px,1.3vw,18px)}
.utensil-gallery{display:flex;align-items:start;justify-content:space-evenly;gap:7px;flex-wrap:wrap}
.utensil-tile{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:85px;min-width:49px;text-align:center;color:#60412f;font-size:10px;line-height:1.3}
.utensil-tile svg{width:27px;height:27px;color:#956841}
.utensil-tip{font-size:11px;margin:9px 0 0;color:#765843}
.tag-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.tag-row .mini-badge{font-size:11px;border-radius:17px;padding:6px 10px;background:#f3dfc6}
.tag-add{display:grid;place-items:center;background:#fff7e9;border:1px solid #ddc6ab;color:#583926;border-radius:50%;width:27px;height:27px}
.tag-add svg{width:15px;height:15px}
.notes-panel p{font-size:12px;line-height:1.6;white-space:pre-line;margin:0;color:#4b3526}
.detail-actions-bottom{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:17px}
/* Additional browse views and functional trash */
.browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.browse-tile{border:1px solid #dfc7ab;border-radius:12px;padding:20px;background:#fff7e9;text-align:left;display:flex;align-items:center;gap:13px;color:#492a1b}
.browse-tile svg{width:23px;height:23px}
.browse-tile span{font-family:Georgia,serif;font-size:18px}
.browse-tile small{margin-left:auto;font-size:11px;color:#83634b}
.trash-list{display:grid;gap:12px}
.trash-item{background:#fff7e9;border:1px solid #dcc7b0;border-radius:12px;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.trash-actions{display:flex;gap:8px;flex-wrap:wrap}
/* Mobile: same aesthetic, one column, no horizontal overflow. */
@media(max-width:1100px){.sidebar{padding-inline:8px}.main{padding-inline:15px}.recipe-panel-bar h2{font-size:15px}.prep-step{grid-template-columns:24px 66px minmax(0,1fr) 78px;gap:7px;padding:7px}.step-visual{height:63px}.detail-lower{gap:8px}.detail-hero-copy h1{font-size:clamp(22px,2.6vw,35px)}.hero-actions{gap:4px}.hero-actions .btn{padding:8px}}
@media(max-width:750px){
 .app{display:block}.sidebar{display:none}.main{padding:14px 13px 96px}.bottom-nav{background:#392013f5;border-top:1px solid #754c33;box-shadow:0 -5px 24px #381a0c25}.bottom-nav button{color:#d5bca7}.bottom-nav button.active{color:#fff3e2}.bottom-nav button svg{width:22px;height:22px}
 .detail-breadcrumb{margin:0 0 13px}.crumb-title{max-width:45vw}.crumb-search{padding:7px;min-width:0}.crumb-search span{display:none}
 .detail-hero{grid-template-columns:1fr;gap:10px}.hero-photo .view-photo{height:220px}.detail-hero-copy{padding:4px 0 0}.detail-hero-copy h1{font-size:30px;max-width:calc(100% - 105px)}.hero-actions{right:0;top:1px}.hero-actions .btn{font-size:0;padding:9px}.hero-actions .btn svg{width:18px;height:18px}.hero-stats{justify-content:space-between}.hero-stats>div{padding:0 7px;gap:5px}.hero-stats svg{width:18px;height:18px}.hero-stats strong{font-size:11px}.hero-stats span{font-size:9px}
 .detail-columns{grid-template-columns:1fr;gap:12px}.detail-lower{grid-template-columns:1fr;gap:12px}.recipe-panel-bar h2,.detail-lower .recipe-panel-bar h2{font-size:18px}.recipe-panel-body{padding:12px}.prep-step{grid-template-columns:25px 69px minmax(0,1fr) 79px}.step-info h4{font-size:14px}.step-info p{font-size:11px}.step-visual{height:65px}.step-meta span{font-size:9px}.detail-actions-bottom .btn{font-size:11px}.sheet{width:100%}
 .side-note{display:none}
}
@media(max-width:390px){.prep-step{grid-template-columns:25px 54px minmax(0,1fr);gap:7px}.step-meta{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0}.step-meta span{font-size:10px}.hero-photo .view-photo{height:195px}.hero-stats>div{padding:0 5px}.ingredient-section-head{font-size:14px}}

#importRecipeInput{display:none}
.toast:empty{display:none}
.toast:not(.show){opacity:0;pointer-events:none}
.toast.show{opacity:1}
/* En móvil la navegación inferior permanece fija; los datos siguen desplazándose por detrás. */
@media(max-width:750px){.detail-actions-bottom{padding-bottom:34px}}

function imageURL(r,small=false,index=0){const p=recipePhotos(r)[index]||recipePhotos(r)[0];if(!p)return null;const blob=(small&&p.photoThumb)||p.photo;if(!blob)return null;const key=r.id+'#'+p.id+(small?'#thumb':'#photo');let a=picURLs.get(key);if(a&&a.blob===blob)return a.url;if(a)URL.revokeObjectURL(a.url);const url=URL.createObjectURL(blob);picURLs.set(key,{blob,url});return url}

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('mi-recetario-v1',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('recipes'))d.createObjectStore('recipes',{keyPath:'id'});if(!d.objectStoreNames.contains('ingredients'))d.createObjectStore('ingredients',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function storeGet(name,id){return new Promise((res,rej)=>{const tx=db.transaction(name,'readonly');const req=tx.objectStore(name).get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function storeAll(name){return new Promise((res,rej)=>{const tx=db.transaction(name,'readonly');const req=tx.objectStore(name).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function storePut(name,item){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).put(item);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function storeDelete(name,id){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function refresh(){const all=await storeAll('recipes');recipes=all.filter(r=>!r.deletedAt);trashRecipes=all.filter(r=>!!r.deletedAt);customIngredients=await storeAll('ingredients')}

function nameFor(id){return ingredientsCatalog().find(x=>x.id===id)?.name||'Ingrediente desconocido'}

function recipeFiltered(){let out=recipes.filter(r=>tab!=='favorites'||r.favorite);if(mealFilter!=='Todas')out=out.filter(r=>(r.mealTypes||[]).includes(mealFilter));if(tagFilter)out=out.filter(r=>(r.tags||[]).some(t=>norm(t)===norm(tagFilter)));if(query.trim()){const term=norm(query);out=out.filter(r=>[r.name,...(r.tags||[]),...(r.ingredients||[]).map(i=>nameFor(i.ingredientId))].some(s=>norm(s).includes(term)))}out.sort((a,b)=>sortBy==='az'?a.name.localeCompare(b.name,'es'):sortBy==='old'?new Date(a.createdAt)-new Date(b.createdAt):new Date(b.updatedAt)-new Date(a.updatedAt));return out}

function photoDraftURL(p){const key=p.id;const entry=draftPhotoURLs.get(key);if(entry&&entry.blob===p.photo)return entry.url;if(entry)URL.revokeObjectURL(entry.url);const url=URL.createObjectURL(p.photo);draftPhotoURLs.set(key,{url,blob:p.photo});return url}

function normalizeDraft(recipe){
  const sections=Array.isArray(recipe.ingredientSections)&&recipe.ingredientSections.length?recipe.ingredientSections.map(x=>({...x})):[{id:'base',title:'Ingredientes'}];
  const first=sections[0].id;
  const steps=Array.isArray(recipe.steps)?recipe.steps.map(s=>({...s,title:s.title||'',id:s.id||uid(),type:s.type==='cooking'?'cooking':'preparation',method:s.method||((s.tempC!==null&&s.tempC!==undefined)?'horno':'sarten'),heat:s.heat||''})):(recipe.instructions?.trim()?[{id:uid(),type:'preparation',text:recipe.instructions,durationMinutes:null,tempC:null,notes:''}]:[]);

const PHOTO_TARGET_BYTES=150*1024;

function canvasBlob(canvas,type,quality){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('No se pudo codificar la imagen')),type,quality))}
function loadImageForCompression(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Formato no compatible. Convierte la foto a JPEG o PNG.'))};img.src=url})}
async function compressPhoto(file){
  if(file.size>35*1024*1024)throw new Error('La fotografía es demasiado grande (máximo 35 MB)');
  const img=await loadImageForCompression(file);
  const maxOriginal=Math.max(img.naturalWidth,img.naturalHeight);
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx)throw new Error('No hay procesador gráfico disponible');
  const suitableWebp=await (async()=>{canvas.width=2;canvas.height=2;try{const b=await canvasBlob(canvas,'image/webp',.80);return b.type==='image/webp'}catch(_){return false}})();
  const mime=suitableWebp?'image/webp':'image/jpeg';
  let best=null;
  const stages=[1200,1120,1024,960,880,800];
  // Search sensible visual qualities; target is approximate, not a hard cap.
  for(const edge of stages){
    const size=Math.min(edge,maxOriginal);
    const scale=size/maxOriginal;
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    for(const quality of [.84,.78,.72,.66,.60,.54]){
      const blob=await canvasBlob(canvas,mime,quality);
      if(!best||blob.size<best.blob.size)best={blob,width:canvas.width,height:canvas.height,mime,quality};
      if(blob.size<=PHOTO_TARGET_BYTES){best={blob,width:canvas.width,height:canvas.height,mime,quality};break}
    }
    if(best.blob.size<=PHOTO_TARGET_BYTES)break;
  }
  // Thumbnail: optimized separately; small enough to render a large gallery.
  const thumbScale=Math.min(1,320/maxOriginal);
  canvas.width=Math.max(1,Math.round(img.naturalWidth*thumbScale));
  canvas.height=Math.max(1,Math.round(img.naturalHeight*thumbScale));
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const thumb=await canvasBlob(canvas,mime,.70);
  return {photo:best.blob,photoThumb:thumb,info:{originalBytes:file.size,optimizedBytes:best.blob.size,thumbBytes:thumb.size,width:best.width,height:best.height,format:best.mime.split('/')[1],targetMet:best.blob.size<=PHOTO_TARGET_BYTES}};
}

async function toggleFavorite(id){const r=recipes.find(x=>x.id===id);if(!r)return;r.favorite=!r.favorite;r.updatedAt=now();await storePut('recipes',r);await refresh();render();toast(r.favorite?'Añadida a favoritas':'Quitada de favoritas')}

function duplicateOpened(){const r=recipes.find(x=>x.id===opened);if(!r)return;const cloned={...r,id:uid(),name:r.name+' (copia)',favorite:false,photos:recipePhotos(r).map(p=>({...p,id:uid()})),ingredients:(r.ingredients||[]).map(i=>({...i})),ingredientSections:(r.ingredientSections||[{id:'base',title:'Ingredientes'}]).map(s=>({...s})),steps:(r.steps||[]).map(s=>({...s,id:uid()})),tags:[...(r.tags||[])],utensils:[...(r.utensils||[])],utensilNotes:r.utensilNotes||'',mealTypes:[...(r.mealTypes||[])],createdAt:now(),updatedAt:now()};opened=null;newDraft(cloned)}
function toDataURL(blob){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(rd.error);rd.readAsDataURL(blob)})}
function fromDataURL(data){if(typeof data!=='string'||!/^data:image\/(jpeg|png|webp);base64,/.test(data))return null;const i=data.indexOf(',');const mime=data.substring(5,data.indexOf(';'));const raw=atob(data.slice(i+1));const a=new Uint8Array(raw.length);for(let k=0;k<raw.length;k++)a[k]=raw.charCodeAt(k);return new Blob([a],{type:mime})}
async function shareOpenedRecipe(){
 const r=recipes.find(x=>x.id===opened);if(!r)return;
 try{
  const item={...r,photos:await Promise.all(recipePhotos(r).map(async p=>({...p,photo:p.photo?await toDataURL(p.photo):null,photoThumb:p.photoThumb?await toDataURL(p.photoThumb):null}))),photo:null,photoThumb:null};
  const used=new Set(r.ingredients.map(x=>x.ingredientId));
  const ingredients=ingredientsCatalog().filter(x=>used.has(x.id));
  const data={format:'mi-receta',schemaVersion:1,exportedAt:now(),recipe:item,ingredients};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const slug=norm(r.name).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,55)||'receta';
  const file=new File([blob],slug+'.mireceta',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:r.name,text:'Receta para importar en Mi Recetario'});return}catch(err){if(err?.name==='AbortError')return;console.warn(err)}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Archivo de receta preparado para compartir');
 }catch(err){console.error(err);toast('No se ha podido exportar esta receta')}
}
async function importSharedRecipe(e){
 const f=e.target.files?.[0];e.target.value='';if(!f)return;
 if(f.size>25*1024*1024){toast('El archivo supera el máximo de 25 MB');return}
 try{
  const p=JSON.parse(await f.text());
  if(p.format!=='mi-receta'||p.schemaVersion!==1||!p.recipe||typeof p.recipe.name!=='string'||!Array.isArray(p.recipe.ingredients)||!Array.isArray(p.ingredients))throw Error('Formato no reconocido');
  if(p.recipe.name.length>120||p.ingredients.length>1000||p.recipe.ingredients.length>1000)throw Error('Archivo de receta inválido');
  const entry={...p.recipe,id:uid(),name:p.recipe.name,createdAt:now(),updatedAt:now(),photos:(p.recipe.photos||[]).map(img=>({...img,id:uid(),photo:fromDataURL(img.photo),photoThumb:fromDataURL(img.photoThumb)})),photo:null,photoThumb:null,favorite:false};
  const validIng=p.ingredients.filter(i=>i&&typeof i.id==='string'&&typeof i.name==='string'&&i.name.length<100);
  if(!confirm(`¿Importar «${entry.name}» a tu recetario? Se añadirá una copia independiente.`))return;
  await new Promise((res,rej)=>{const tx=db.transaction(['recipes','ingredients'],'readwrite');for(const ingredient of validIng)tx.objectStore('ingredients').put({id:ingredient.id,name:ingredient.name});tx.objectStore('recipes').put(entry);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});
  await refresh();render();toast('Receta importada y guardada');
 }catch(err){console.error(err);toast('No se pudo importar: comprueba el archivo .mireceta')}
}

async function exportBackup(){try{toast('Preparando copia completa…');const exported=await Promise.all([...recipes,...trashRecipes].map(async r=>({...r,photo:r.photo?await toDataURL(r.photo):null,photoThumb:r.photoThumb?await toDataURL(r.photoThumb):null,photos:await Promise.all((r.photos||[]).map(async p=>({...p,photo:p.photo?await toDataURL(p.photo):null,photoThumb:p.photoThumb?await toDataURL(p.photoThumb):null})))})));const payload={format:'mi-recetario',schemaVersion:4,exportedAt:now(),recipes:exported,ingredients:customIngredients};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-recetario-copia-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast(`Copia creada: ${recipes.length} recetas, secciones, pasos y fotografías`)}catch(e){console.error(e);toast('No se pudo exportar la copia')}}
async function restoreBackup(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>250*1024*1024){toast('La copia es demasiado grande para restaurarla aquí');return}let payload;try{payload=JSON.parse(await file.text());if(payload.format!=='mi-recetario'||![1,2,3,4].includes(payload.schemaVersion)||!Array.isArray(payload.recipes)||!Array.isArray(payload.ingredients))throw Error('Formato inválido');if(payload.recipes.some(r=>!r.id||typeof r.name!=='string'||!Array.isArray(r.ingredients)))throw Error('Contenido inválido')}catch(err){toast('El archivo no es una copia válida de Mi Recetario');return}if(!confirm(`¿Restaurar ${payload.recipes.length} recetas? Se SUSTITUIRÁN las recetas actuales de este navegador. Exporta antes una copia de seguridad.`))return;try{const restored=payload.recipes.map(r=>({...r,photo:r.photo?fromDataURL(r.photo):null,photoThumb:r.photoThumb?fromDataURL(r.photoThumb):null,photos:Array.isArray(r.photos)?r.photos.map(p=>({...p,photo:fromDataURL(p.photo),photoThumb:fromDataURL(p.photoThumb)})):undefined}));await new Promise((res,rej)=>{const tx=db.transaction(['recipes','ingredients'],'readwrite');tx.objectStore('recipes').clear();tx.objectStore('ingredients').clear();for(const r of restored)tx.objectStore('recipes').put(r);for(const ing of payload.ingredients)if(ing.id&&ing.name)tx.objectStore('ingredients').put(ing);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});for(const a of picURLs.values())URL.revokeObjectURL(a.url);picURLs.clear();await refresh();render();toast(`${restored.length} recetas restauradas correctamente`)}catch(err){console.error(err);toast('No se pudo completar la restauración')}}
function router(tabName){opened=null;tab=tabName;mealFilter='Todas';tagFilter='';query='';window.scrollTo({top:0,behavior:'smooth'});render()}

  const coverPhoto=e.target.closest('[data-cover-photo]');if(coverPhoto&&draft){const idx=draft.photos.findIndex(p=>p.id===coverPhoto.dataset.coverPhoto);if(idx>0){draft.photos.unshift(draft.photos.splice(idx,1)[0]);refreshDraftPhotos()}return}
  const viewPhoto=e.target.closest('[data-view-photo]');if(viewPhoto){openedPhotoIndex=Number(viewPhoto.dataset.viewPhoto);const r=recipes.find(x=>x.id===opened);if(r){const target=$('photoDetail');if(target)target.innerHTML=photoDetailMarkup(r)}return}
  const rmUt=e.target.closest('[data-rmutensil]');if(rmUt&&draft){draft.utensils.splice(Number(rmUt.dataset.rmutensil),1);$('utensilTags').innerHTML=utensilsMarkup();return}

  const op=e.target.closest('[data-action]');if(op){const action=op.dataset.action;
    if(action==='new')newDraft();if(action==='demo')await addDemo();if(action==='clearfilters'){mealFilter='Todas';tagFilter='';query='';renderRecipes()}if(action==='close')closeOverlay();if(action==='save')await saveRecipe();if(action==='addtag')addTag();if(action==='addutensil')addUtensil();if(action==='add-section')addSection();if(action==='add-step')addStep();
    if(action==='edit'){const r=recipes.find(x=>x.id===opened);if(r)newDraft(r)}if(action==='backdetail'){opened=null;render();window.scrollTo({top:0,behavior:'smooth'})}if(action==='delete')await deleteOpened();if(action==='duplicate')duplicateOpened();if(action==='increase'){openedServings=Math.min(99,openedServings+1);updateServings()}if(action==='decrease'){openedServings=Math.max(1,openedServings-1);updateServings()}if(action==='share')await shareOpenedRecipe();if(action==='importrecipe')$('importRecipeInput').click();if(action==='backup')await exportBackup();if(action==='restore')$('restoreInput').click();return}
  const open=e.target.closest('[data-open]');if(open){openRecipe(open.dataset.open);return}if(e.target===$('overlay'))closeOverlay()
});
document.addEventListener('keydown',e=>{const search=e.target.closest('[data-section-search]');if(search&&e.key==='Enter'){e.preventDefault();const area=[...document.querySelectorAll('[data-suggest]')].find(x=>x.dataset.suggest===search.dataset.sectionSearch);const first=area?.classList.contains('open')?area.querySelector('button'):null;if(first)first.click();else addTypedIngredient(search.dataset.sectionSearch);return}if(e.key==='Escape'&&$('overlay').classList.contains('open'))closeOverlay();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openRecipe(e.target.dataset.open)}});
document.addEventListener('input',e=>{const qty=e.target.closest('[data-ingqty]');if(qty&&draft){const i=draft.ingredients[Number(qty.dataset.ingqty)];i.quantity=qty.value.trim()===''?null:Math.max(0,Number(qty.value))}const section=e.target.closest('[data-section-title]');if(section&&draft){const x=draft.ingredientSections.find(x=>x.id===section.dataset.sectionTitle);if(x)x.title=section.value}const sf=e.target.closest('[data-step-field]');if(sf&&draft&&sf.dataset.stepField!=='type'){updateStepField(sf)}const search=e.target.closest('[data-section-search]');if(search&&draft)suggestionsList(search);if(e.target.id==='recipeSearch'){query=e.target.value;updateRecipeResults()}});
document.addEventListener('change',e=>{if(e.target.id==='sortFilter'){sortBy=e.target.value;renderRecipes()}if(e.target.id==='tagFilter'){tagFilter=e.target.value;renderRecipes()}const unit=e.target.closest('[data-ingunit]');if(unit&&draft){const ing=draft.ingredients[Number(unit.dataset.ingunit)];ing.unit=unit.value;if(unit.value==='al gusto')ing.quantity=null;refreshDraftIngredients()}const sf=e.target.closest('[data-step-field]');if(sf&&draft&&['type','method','heat','photoId'].includes(sf.dataset.stepField))updateStepField(sf)});
$('restoreInput').addEventListener('change',restoreBackup);
$('importRecipeInput').addEventListener('change',importSharedRecipe);
(async()=>{try{db=await openDB();await refresh();render()}catch(err){console.error(err);$('main').innerHTML=`<div class="empty"><h2>No se pudo abrir el almacenamiento local</h2><p>Prueba a abrir el HTML desde un navegador convencional con almacenamiento habilitado. Para uso en iPhone, es preferible alojar la aplicación en una dirección HTTPS.</p></div>`}})();

</script>

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Sin modo offline instalado:',e)));
}
</script>
