:root{--bg:#fbf1e4;--surface:#fff9f0;--surface2:#f5e6d2;--ink:#352216;--ink2:#594638;--muted:#8c7866;--green:#503021;--green2:#f1decb;--orange:#b07b46;--border:#e7d5be;--shadow:0 5px 23px rgba(62,32,17,.10);--r:15px;--espresso:#4a2717;--coffee:#392014;--coffee2:#6e472f;--soft:#f5e4cf}

.nav{gap:2px;overflow-y:auto;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:#795440 transparent}

function ui(name){return UI[name]||ICONS[name]||UI.book}

const MEALS=['Desayuno','Comida','Merienda','Cena'];

 ['preparation','Preparación'],['cooking','Cocción'],['rest','Reposo'],['proofing','Fermentación / levado'],
 ['cooling','Enfriado'],['refrigeration','Refrigeración'],['freezing','Congelación'],
 ['marinating','Marinado / maceración'],['finishing','Montaje / acabado'],['other','Otro']
];

const showHeat=id=>['sarten','olla','plancha','parrilla','otros'].includes(id);

const UNITS=[['g','g'],['kg','kg'],['ml','ml'],['l','l'],['ud','ud.'],['cda','cda.'],['cdta','cdta.'],['taza','taza'],['pizca','pizca'],['al gusto','al gusto']];
const now=()=>new Date().toISOString();
const LAST_BACKUP_KEY='mi-recetario-last-backup-v14';
function lastBackupStatus(){try{return JSON.parse(localStorage.getItem(LAST_BACKUP_KEY)||'null')}catch{return null}}
function recordBackupStatus(type,stats){try{localStorage.setItem(LAST_BACKUP_KEY,JSON.stringify({type,date:now(),recipes:stats.recipes,photos:stats.photos}))}catch(err){console.warn('No se pudo registrar fecha de copia',err)}}
function backupStatusMarkup(){const b=lastBackupStatus();if(!b)return '<p class="tiny">Todavía no se ha comprobado ningún archivo de copia en este dispositivo.</p>';const date=new Date(b.date);return `<p class="tiny">${b.type==='verified'?'Último archivo de copia verificado':'Última copia preparada'}: ${Number.isFinite(date.getTime())?date.toLocaleString('es-ES'):'fecha desconocida'} · ${b.recipes} recetas · ${b.photos} fotografías.</p>`}

const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const ingId=name=>'ing-'+norm(name).replace(/[^a-z0-9 ]/g,'').replace(/ /g,'-');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const plural=(n,sing,plur)=>n===1?sing:plur;
const fmt=n=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:2});
const btn=(text,fn,kind='secondary')=>`<button type="button" class="btn ${kind}" data-action="${fn}">${text}</button>`;
let trashRecipes=[],db,recipes=[],customIngredients=[],tab='recipes',mealFilter='Todas',tagFilter='',query='',sortBy='recent',draft=null,opened=null,openedServings=2,openedPhotoIndex=0,searchTimer=null,photoProcessing=false;
const picURLs=new Map();
function recipePhotos(r){return Array.isArray(r.photos)&&r.photos.length?r.photos:(r.photo?[{id:'legacy',photo:r.photo,photoThumb:r.photoThumb||null,info:r.photoInfo||null}]:[])}
function imageURL(r,small=false,index=0){const p=recipePhotos(r)[index];if(!p)return null;const blob=(small&&p.photoThumb)||p.photo;if(!blob)return null;const key=r.id+'#'+p.id+(small?'#thumb':'#photo');let a=picURLs.get(key);if(a&&a.blob===blob)return a.url;if(a)URL.revokeObjectURL(a.url);const url=URL.createObjectURL(blob);picURLs.set(key,{blob,url});return url}
function releaseImage(id){for(const key of [...picURLs.keys()]){if(key.startsWith(id+'#')){URL.revokeObjectURL(picURLs.get(key).url);picURLs.delete(key)}}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),3200)}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('mi-recetario-v1',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('recipes'))d.createObjectStore('recipes',{keyPath:'id'});if(!d.objectStoreNames.contains('ingredients'))d.createObjectStore('ingredients',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function storeGet(name,id){return new Promise((res,rej)=>{const tx=db.transaction(name,'readonly');const req=tx.objectStore(name).get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function storeAll(name){return new Promise((res,rej)=>{const tx=db.transaction(name,'readonly');const req=tx.objectStore(name).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function storePut(name,item){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).put(item);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function storeDelete(name,id){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function refresh(){const all=await storeAll('recipes');recipes=all.filter(r=>!r.deletedAt);trashRecipes=all.filter(r=>!!r.deletedAt);customIngredients=await storeAll('ingredients')}
function ingredientsCatalog(){const seen=new Map();for(const n of DEFAULT_INGREDIENTS){seen.set(norm(n),{id:ingId(n),name:n})}for(const x of customIngredients)seen.set(norm(x.name),x);return Array.from(seen.values())}
function nameFor(id){return ingredientsCatalog().find(x=>x.id===id)?.name||'Ingrediente desconocido'}
function usageFor(id){return recipes.reduce((a,r)=>a+(r.ingredients||[]).filter(i=>i.ingredientId===id).length,0)}
const demoData=[{name:'Arroz con pollo y verduras',mealTypes:['Comida','Cena'],tags:['Casera','Para repetir'],servings:2,ingredients:[['Arroz',150,'g'],['Pechuga de pollo',250,'g'],['Pimiento rojo',1,'ud'],['Cebolla',0.5,'ud'],['Aceite de oliva',2,'cda']],instructions:'Sofreír la cebolla y el pimiento. Añadir el pollo troceado y dorar. Incorporar el arroz y el agua; cocinar hasta que esté en su punto.',emoji:'🍚'},{name:'Tostada de aguacate y huevo',mealTypes:['Desayuno','Merienda'],tags:['Rápida'],servings:1,ingredients:[['Pan integral',2,'ud'],['Aguacate',0.5,'ud'],['Huevo',1,'ud']],instructions:'Tostar el pan, machacar el aguacate y colocar encima el huevo cocinado al gusto.',emoji:'🥑'},{name:'Salmón al horno con patata',mealTypes:['Comida','Cena'],tags:['Horno','Favorita'],servings:2,ingredients:[['Salmón',300,'g'],['Patata',250,'g'],['Limón',0.5,'ud'],['Aceite de oliva',1,'cda']],instructions:'Hornear la patata en rodajas. Añadir el salmón con limón y terminar la cocción.',emoji:'🐟'}];
async function addDemo(){if(!confirm('¿Añadir tres recetas de ejemplo para probar los filtros? Puedes eliminarlas cuando quieras.'))return;for(const t of demoData){const x={id:uid(),name:t.name,mealTypes:t.mealTypes,tags:t.tags,servings:t.servings,ingredients:t.ingredients.map(a=>({ingredientId:ingId(a[0]),quantity:a[1],unit:a[2]})),instructions:t.instructions,notes:'Receta de demostración',favorite:false,photo:null,emoji:t.emoji,createdAt:now(),updatedAt:now(),demo:true};await storePut('recipes',x)}await refresh();render();toast('3 recetas de ejemplo añadidas')}
const NAV=[['recipes','Mis recetas','book'],['favorites','Favoritas','heart'],['tags','Etiquetas','tag'],['categories','Categorías','folder'],['ingredients','Ingredientes','leaf'],['utensils','Utensilios','utensils'],['trash','Papelera','trash'],['settings','Configuración','settings']];
const MOBILE_NAV=new Set(['recipes','favorites','tags','settings']);
function renderNav(){
 $('desktopNav').innerHTML='<button class="nav-home" data-nav="recipes">'+ui('home')+'<span>Inicio</span></button>'+NAV.map(([id,label,ico])=>`<button class="${tab===id?'active':''}" data-nav="${id}">${ui(ico)}<span>${label}</span></button>`).join('')+'<div class="nav-collections"><div>COLECCIONES</div>'+allTags().slice(0,4).map(t=>`<button data-browsetag="${esc(t)}">${ui('folder')}<span>${esc(t)}</span><small>${recipes.filter(r=>(r.tags||[]).includes(t)).length}</small></button>`).join('')+'</div>';
 $('mobileNav').innerHTML=NAV.filter(([id])=>MOBILE_NAV.has(id)).map(([id,label,ico])=>`<button class="${tab===id?'active':''}" data-nav="${id}">${ui(ico)}<span>${label}</span></button>`).join('');
}

function header(k,title,sub,showAdd=true){return `<div class="topbar"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(title)}</h1><p class="subheadline">${esc(sub)}</p></div>${showAdd?btn(ICONS.plus+' <span>Añadir receta</span>','new','primary'):''}</div>`}
function recipeFiltered(){let out=recipes.filter(r=>tab!=='favorites'||r.favorite);if(mealFilter!=='Todas')out=out.filter(r=>(r.mealTypes||[]).includes(mealFilter));if(tagFilter)out=out.filter(r=>(r.tags||[]).some(t=>norm(t)===norm(tagFilter)));if(query.trim()){const term=norm(query);out=out.filter(r=>[r.name,...(r.tags||[]),...(r.ingredients||[]).map(i=>nameFor(i.ingredientId))].some(s=>norm(s).includes(term)))}out.sort((a,b)=>sortBy==='az'?a.name.localeCompare(b.name,'es'):sortBy==='old'?new Date(a.createdAt)-new Date(b.createdAt):new Date(b.updatedAt)-new Date(a.updatedAt));return out}
function allTags(){return [...new Set(recipes.flatMap(r=>r.tags||[]))].sort((a,b)=>a.localeCompare(b,'es'))}
function card(r){
 const images=recipePhotos(r).map((p,i)=>imageURL(r,true,i)).filter(Boolean);
 const d=(r.mealTypes||[]).slice(0,2),multi=images.length>1;
 return `<article class="recipe-card"><div class="card-img">${images.length?`<div class="card-photo-scroll" aria-label="Fotografías de ${esc(r.name)}" tabindex="0">${images.map((src,i)=>`<div class="card-slide"><img src="${esc(src)}" alt="Fotografía ${i+1} de ${esc(r.name)}" loading="lazy" draggable="false"></div>`).join('')}</div>`:`<span class="card-emoji">${esc(r.emoji||'🍽️')}</span>`}${multi?`<button type="button" class="card-carousel-arrow prev" data-card-photo-dir="-1" aria-label="Fotografía anterior" disabled>‹</button><button type="button" class="card-carousel-arrow next" data-card-photo-dir="1" aria-label="Fotografía siguiente">›</button><span class="card-photo-position" aria-live="off">1 de ${images.length}</span>`:''}<button aria-label="${r.favorite?'Quitar de favoritos':'Añadir a favoritos'}" class="fave ${r.favorite?'active':''}" data-fave="${esc(r.id)}" title="Favorito">♥</button></div><div class="card-body"><h3><button type="button" class="card-open-title" data-open="${esc(r.id)}" aria-label="Abrir receta ${esc(r.name)}">${esc(r.name)}</button></h3><div class="badges">${d.map(t=>`<span class="mini-badge">${esc(t)}</span>`).join('')}${(r.tags||[]).slice(0,1).map(t=>`<span class="mini-badge alt">${esc(t)}</span>`).join('')}</div><div class="card-foot"><span>♧ ${(r.ingredients||[]).length} ingredientes</span><span>◉ ${esc(r.servings)} ${plural(r.servings,'ración','raciones')}</span></div></div></article>`
}

class="panel"><h2>Próxima conexión a la nube</h2><p>La estructura está preparada para la futura sincronización gratuita, con separación de recetas, secciones, pasos, ingredientes e imágenes.</p></div><p class="version">Mi Recetario · v1.5.1 · Ingredientes, preparación, utensilios y compartir recetas · IndexedDB local</p>`}

function overlayHeader(title,extra=''){return `<div class="sheet-top"><span class="sheet-head">${esc(title)}</span><span style="display:flex;gap:8px">${extra}<button class="close" data-action="close" aria-label="Cerrar">×</button></span></div>`}
const draftPhotoURLs=new Map();
const stepPhotoPickers=new Set();
function photoDraftURL(p){const key=p.id;const entry=draftPhotoURLs.get(key);if(entry&&entry.blob===p.photo)return entry.url;if(entry)URL.revokeObjectURL(entry.url);const url=URL.createObjectURL(p.photo);draftPhotoURLs.set(key,{url,blob:p.photo});return url}
function releaseDraftPhotos(){for(const x of draftPhotoURLs.values())URL.revokeObjectURL(x.url);draftPhotoURLs.clear()}
function normalizeDraft(recipe){
  const sections=Array.isArray(recipe.ingredientSections)&&recipe.ingredientSections.length?recipe.ingredientSections.map(x=>({...x})):[{id:'base',title:'Ingredientes'}];
  const first=sections[0].id;
  const originals=recipePhotos(recipe);
  const photos=originals.map(p=>({...p,id:p.id==='legacy'?uid():p.id}));
  const photoMap=new Map(originals.map((p,i)=>[p.id,photos[i].id]));
  const steps=Array.isArray(recipe.steps)?recipe.steps.map(s=>({
    ...s,id:s.id||uid(),title:s.title||'',type:STEP_TYPES.some(([k])=>k===s.type)?s.type:'preparation',
    method:s.method||((s.tempC!==null&&s.tempC!==undefined)?'horno':'sarten'),
    heat:s.heat||'',durationMinutes:s.durationMinutes??null,conditions:s.conditions||'',
    photoId:s.photoId?(photoMap.get(s.photoId)||''):''
  })):(recipe.instructions?.trim()?[{id:uid(),type:'preparation',text:recipe.instructions,title:'',durationMinutes:null,tempC:null,notes:'',photoId:'',conditions:''}]:[]);
  return {...recipe,ingredientSections:sections,ingredients:(recipe.ingredients||[]).map(i=>({...i,sectionId:i.sectionId||first})),steps,photos,photo:null,photoThumb:null,photoInfo:null,mealTypes:[...(recipe.mealTypes||[])],tags:[...(recipe.tags||[])],utensils:[...(recipe.utensils||[])],utensilNotes:recipe.utensilNotes||''};
}
function newDraft(recipe=null){releaseDraftPhotos();stepPhotoPickers.clear();draft=recipe?normalizeDraft(recipe):{id:uid(),name:'',photos:[],servings:2,ingredientSections:[{id:'base',title:'Ingredientes'}],ingredients:[],steps:[],description:'',difficulty:'',mealTypes:['Comida'],tags:[],utensils:[],utensilNotes:'',instructions:'',notes:'',favorite:false,createdAt:now(),updatedAt:now()};renderEditor()}
function photoEditorMarkup(){return `<div class="photos-editor"><label class="add-multi-photo"><span>＋ 📷 Añadir fotografías</span><small>Selecciona una o varias · Se optimizan automáticamente (~150 KB cada una)</small><input type="file" id="photoInput" accept="image/*" multiple aria-label="Añadir fotografías del plato"></label><div class="photo-thumbs" id="photoThumbs">${draft.photos.map((p,i)=>`<div class="photo-thumb"><img src="${esc(photoDraftURL(p))}" alt="Foto ${i+1}"><span class="photo-number">${i===0?'Principal':`Foto ${i+1}`}</span><div class="photo-tools">${i>0?`<button type="button" data-cover-photo="${esc(p.id)}" title="Elegir como portada" aria-label="Usar foto ${i+1} como portada">★</button>`:'<span class="cover-star" title="Portada">★</span>'}<button type="button" data-remove-photo="${esc(p.id)}" aria-label="Quitar foto ${i+1}" title="Eliminar fotografía">×</button></div></div>`).join('')}</div>${draft.photos.length?`<p class="tiny" style="margin:10px 0 0">${draft.photos.length} ${plural(draft.photos.length,'fotografía','fotografías')}. Pulsa ★ para elegir la portada.</p>`:''}</div>`}
function ingredientGroupMarkup(section){const si=draft.ingredientSections.findIndex(s=>s.id===section.id),items=draft.ingredients.map((x,i)=>({...x,_index:i})).filter(x=>x.sectionId===section.id);return `<div class="group-card"><div class="group-head"><span class="group-count">Sección ${si+1}</span><div class="mini-tools">${si>0?`<button data-move-section="${esc(section.id)}" data-dir="-1" title="Subir sección">↑</button>`:''}${si<draft.ingredientSections.length-1?`<button data-move-section="${esc(section.id)}" data-dir="1" title="Bajar sección">↓</button>`:''}${draft.ingredientSections.length>1?`<button data-remove-section="${esc(section.id)}" title="Eliminar sección">×</button>`:''}</div></div><input class="text-input section-name" aria-label="Nombre de sección" data-section-title="${esc(section.id)}" maxlength="65" value="${esc(section.title)}" placeholder="Ej. Masa, relleno, cobertura..."/><div class="ing-lines">${items.length?items.map(item=>`<div class="ing-line"><div class="ing-name" title="${esc(nameFor(item.ingredientId))}">${esc(nameFor(item.ingredientId))}</div><input type="number" min="0" step="any" inputmode="decimal" data-ingqty="${item._index}" aria-label="Cantidad de ${esc(nameFor(item.ingredientId))}" value="${item.quantity??''}" placeholder="Cant."/><select data-ingunit="${item._index}" aria-label="Unidad de ${esc(nameFor(item.ingredientId))}">${UNITS.map(([id,title])=>`<option value="${esc(id)}" ${id===item.unit?'selected':''}>${esc(title)}</option>`).join('')}</select><button class="icon-btn" data-rming="${item._index}" aria-label="Quitar ${esc(nameFor(item.ingredientId))}">×</button></div>`).join(''):'<p class="tiny">Todavía no hay ingredientes en esta sección.</p>'}</div><div class="ingredient-add"><div class="ingredient-search-wrap"><input class="text-input" data-section-search="${esc(section.id)}" placeholder="Buscar ingrediente..." autocomplete="off" aria-label="Buscar ingrediente para ${esc(section.title)}"/><div class="suggestions" data-suggest="${esc(section.id)}"></div></div><button class="btn secondary" data-addtyped-section="${esc(section.id)}" type="button">Añadir</button></div></div>`}
function groupsMarkup(){return draft.ingredientSections.map(ingredientGroupMarkup).join('')}
function stepPhotoMarkup(step){
  const assigned=(draft.photos||[]).find(p=>p.id===step.photoId);
  const expanded=stepPhotoPickers.has(step.id);
  return `<div class="step-photo-area"><div class="step-photo-row">${assigned?`<button type="button" class="step-photo-preview" data-draft-photo-preview="${esc(assigned.id)}" aria-label="Ampliar fotografía de este paso"><img src="${esc(photoDraftURL(assigned))}" alt="Miniatura vinculada al paso"></button>`:''}<button type="button" class="btn outline" data-step-photo-toggle="${esc(step.id)}" aria-expanded="${expanded}">${assigned?'Cambiar fotografía':'＋ Añadir fotografía'}</button>${assigned?`<button type="button" class="btn ghost" data-step-photo-clear="${esc(step.id)}">Quitar fotografía</button>`:''}</div>${expanded?`<div class="step-photo-picker"><p class="tiny">Elegir una fotografía que ya pertenece a esta receta:</p>${draft.photos.length?`<div class="step-photo-choices">${draft.photos.map((p,i)=>`<button type="button" class="step-photo-choice ${step.photoId===p.id?'selected':''}" data-step-existing-photo="${esc(step.id)}" data-photo-id="${esc(p.id)}" title="Elegir fotografía ${i+1}" aria-label="Elegir fotografía ${i+1} para este paso" aria-pressed="${step.photoId===p.id}"><img src="${esc(photoDraftURL(p))}" alt="Fotografía ${i+1}"></button>`).join('')}</div>`:'<p class="tiny">Aún no hay fotografías en esta receta.</p>'}<div class="step-photo-sources"><label class="btn secondary step-upload-label">Abrir cámara<input type="file" accept="image/*" capture="environment" data-step-upload="${esc(step.id)}" aria-label="Fotografiar este paso"></label><label class="btn outline step-upload-label">Elegir de la galería<input type="file" accept="image/*" data-step-upload="${esc(step.id)}" aria-label="Elegir foto para este paso"></label></div></div>`:''}</div>`;
}

const PHOTO_TARGET_BYTES=150*1024;
const PHOTO_MAX_EDGE=1200;
const PHOTO_MIN_EDGE=800;
// photoProcessing está declarado en el estado general de la aplicación.
const asKB=n=>`${Math.round(n/1024).toLocaleString('es-ES')} KB`;
function canvasBlob(canvas,type,quality){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('No se pudo codificar la imagen')),type,quality))}
function loadImageForCompression(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Formato no compatible. Convierte la foto a JPEG o PNG.'))};img.src=url})}
async function compressPhoto(file){
  if(file.size>35*1024*1024)throw new Error('La fotografía es demasiado grande (máximo 35 MB)');
  const img=await loadImageForCompression(file);
  const maxOriginal=Math.max(img.naturalWidth,img.naturalHeight);
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx)throw new Error('No hay procesador gráfico disponible');
  const suitableWebp=await (async()=>{canvas.width=2;canvas.height=2;try{const b=await canvasBlob(canvas,'image/webp',.80);return b.type==='image/webp'}catch(_){return false}})();
  const mime=suitableWebp?'image/webp':'image/jpeg';
  let best=null;
  const stages=[1200,1120,1024,960,880,800];
  // Search sensible visual qualities; target is approximate, not a hard cap.
  for(const edge of stages){
    const size=Math.min(edge,maxOriginal);
    const scale=size/maxOriginal;
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    for(const quality of [.84,.78,.72,.66,.60,.54]){
      const blob=await canvasBlob(canvas,mime,quality);
      if(!best||blob.size<best.blob.size)best={blob,width:canvas.width,height:canvas.height,mime,quality};
      if(blob.size<=PHOTO_TARGET_BYTES){best={blob,width:canvas.width,height:canvas.height,mime,quality};break}
    }
    if(best.blob.size<=PHOTO_TARGET_BYTES)break;
  }
  // Thumbnail: optimized separately; small enough to render a large gallery.
  const thumbScale=Math.min(1,320/maxOriginal);
  canvas.width=Math.max(1,Math.round(img.naturalWidth*thumbScale));
  canvas.height=Math.max(1,Math.round(img.naturalHeight*thumbScale));
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const thumb=await canvasBlob(canvas,mime,.70);
  return {photo:best.blob,photoThumb:thumb,info:{originalBytes:file.size,optimizedBytes:best.blob.size,thumbBytes:thumb.size,width:best.width,height:best.height,format:best.mime.split('/')[1],targetMet:best.blob.size<=PHOTO_TARGET_BYTES}};
}
async function handlePhoto(e){
 const files=[...(e.target.files||[])],stepId=e.target.dataset.stepUpload||null;
 e.target.value='';if(!files.length||photoProcessing||!draft)return;
 const activeDraft=draft;photoProcessing=true;
 const save=document.querySelector('[data-action="save"]');if(save){save.disabled=true;save.textContent='Optimizando fotografías…'}
 let ok=0,errors=0,firstPhotoId='';
 try{
  for(let i=0;i<files.length;i++){
   const file=files[i];if(!file.type.startsWith('image/')){errors++;continue}
   toast(`Optimizando fotografía ${i+1}/${files.length}…`);
   try{const result=await compressPhoto(file);const id=uid();activeDraft.photos.push({id,photo:result.photo,photoThumb:result.photoThumb,info:result.info});if(!firstPhotoId)firstPhotoId=id;ok++}
   catch(err){console.error(err);errors++}
  }
  if(draft!==activeDraft)return;
  if(stepId&&firstPhotoId){const step=draft.steps.find(s=>s.id===stepId);if(step)step.photoId=firstPhotoId;stepPhotoPickers.delete(stepId)}
  refreshDraftPhotos();refreshDraftSteps();toast(`${ok} ${plural(ok,'fotografía añadida','fotografías añadidas')}${errors?` · ${errors} sin procesar`:''}`);
 }finally{photoProcessing=false;if(save&&save.isConnected){save.disabled=false;save.innerHTML=ICONS.save+' Guardar receta'}}
}

// Verificación de la copia: formato, firmas de todas las imágenes y referencias.
// No basta con que la descarga empiece: se puede volver a abrir el JSON y comprobar sus blobs.
async function validateBackupPayload(payload){
 if(!payload||payload.format!=='mi-recetario'||![1,2,3,4].includes(payload.schemaVersion)||!Array.isArray(payload.recipes)||!Array.isArray(payload.ingredients))throw Error('Formato de copia no reconocido');
 let photos=0,thumbs=0,bytes=0,orphanLinks=0;
 const visited=new Set();
 async function validateImage(encoded,label,required=false){
  if(encoded===null||encoded===undefined||encoded===''){if(required)throw Error(`Falta la fotografía: ${label}`);return null}
  const blob=fromDataURL(encoded);
  if(!blob||blob.size===0)throw Error(`Imagen ilegible: ${label}`);
  const sig=new Uint8Array(await blob.slice(0,12).arrayBuffer());
  const match=(blob.type==='image/jpeg'&&sig[0]===255&&sig[1]===216&&sig[2]===255)
   ||(blob.type==='image/png'&&sig[0]===137&&sig[1]===80&&sig[2]===78&&sig[3]===71)
   ||(blob.type==='image/webp'&&String.fromCharCode(...sig.slice(0,4))==='RIFF'&&String.fromCharCode(...sig.slice(8,12))==='WEBP');
  if(!match)throw Error(`Cabecera de imagen dañada: ${label}`);
  return blob;
 }
 for(const r of payload.recipes){
  if(!r||typeof r.id!=='string'||!r.id||typeof r.name!=='string'||!Array.isArray(r.ingredients))throw Error('Receta incompleta en la copia');
  if(visited.has(r.id))throw Error('Identificador de receta repetido');visited.add(r.id);
  const images=Array.isArray(r.photos)?r.photos:[];
  const known=new Set();
  for(const [i,p] of images.entries()){
   if(!p||typeof p.id!=='string'||known.has(p.id))throw Error('Fotografías sin identificador o duplicadas');known.add(p.id);
   const main=await validateImage(p.photo,`${r.name} · foto ${i+1}`,true);
   photos++;bytes+=main.size;
   const thumb=await validateImage(p.photoThumb,`${r.name} · miniatura ${i+1}`);
   if(thumb){thumbs++;bytes+=thumb.size}
  }
  // Versiones previas: fotografía única sin galería.
  if(r.photo){const legacy=await validateImage(r.photo,`${r.name} · portada`);photos++;bytes+=legacy.size;
   const thumb=await validateImage(r.photoThumb,`${r.name} · miniatura de portada`);if(thumb){thumbs++;bytes+=thumb.size}}
  if(Array.isArray(r.steps))for(const step of r.steps){if(step.photoId&&!(known.has(step.photoId)||(step.photoId==='legacy'&&r.photo)))orphanLinks++}
 }
 return {recipes:payload.recipes.length,photos,thumbs,bytes,orphanLinks};
}

async function restoreBackup(e){
 const file=e.target.files?.[0];e.target.value='';if(!file)return;
 if(file.size>250*1024*1024){toast('La copia es demasiado grande para restaurarla aquí');return}
 let payload,stats;
 try{payload=JSON.parse(await file.text());stats=await validateBackupPayload(payload)}
 catch(err){console.error(err);toast('La copia está incompleta o contiene fotografías dañadas. No se ha restaurado nada.');return}
 if(!confirm(`¿Restaurar ${stats.recipes} recetas y ${stats.photos} fotografías? Se SUSTITUIRÁN todas las recetas actuales de este navegador. Exporta antes una copia de seguridad.`))return;
 try{
  const restored=payload.recipes.map(r=>({...r,
   photo:r.photo?fromDataURL(r.photo):null,photoThumb:r.photoThumb?fromDataURL(r.photoThumb):null,
   photos:Array.isArray(r.photos)?r.photos.map(p=>({...p,photo:fromDataURL(p.photo),photoThumb:fromDataURL(p.photoThumb)})):undefined
  }));
  await new Promise((res,rej)=>{const tx=db.transaction(['recipes','ingredients'],'readwrite');
   tx.objectStore('recipes').clear();tx.objectStore('ingredients').clear();
   for(const r of restored)tx.objectStore('recipes').put(r);
   for(const ing of payload.ingredients)if(ing.id&&ing.name)tx.objectStore('ingredients').put(ing);
   tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)
  });
  // Leer de nuevo IndexedDB, no fiarse únicamente de que se completó el evento.
  const all=await storeAll('recipes');let count=0,byteCount=0;
  for(const r of all){for(const p of (r.photos||[])){if(p.photo instanceof Blob){count++;byteCount+=p.photo.size}if(p.photoThumb instanceof Blob)byteCount+=p.photoThumb.size}
   if(r.photo instanceof Blob){count++;byteCount+=r.photo.size}if(r.photoThumb instanceof Blob)byteCount+=r.photoThumb.size
  }
  for(const a of picURLs.values())URL.revokeObjectURL(a.url);picURLs.clear();
  await refresh();render();
  if(all.length===stats.recipes&&count===stats.photos&&byteCount===stats.bytes)toast(`Restauradas y comprobadas ${stats.recipes} recetas y ${stats.photos} fotos`);
  else toast('Advertencia: los datos restaurados no coinciden con la copia. Compruébalos antes de seguir.');
 }catch(err){console.error(err);toast('No se pudo completar la restauración; revisa el almacenamiento local')}
}

   if(enlarge){const r=recipes.find(x=>x.id===opened),idx=Number(enlarge.dataset.enlargeStepPhoto);if(r)openImageLightbox(imageURL(r,false,idx),`Fotografía del paso de ${r.name}`);return}
   const draftPreview=e.target.closest('[data-draft-photo-preview]');
   if(draftPreview&&draft){const p=draft.photos.find(p=>p.id===draftPreview.dataset.draftPhotoPreview);if(p)openImageLightbox(photoDraftURL(p),'Fotografía del paso');return}
   const stepPhotoToggle=e.target.closest('[data-step-photo-toggle]');
   if(stepPhotoToggle&&draft){const id=stepPhotoToggle.dataset.stepPhotoToggle;stepPhotoPickers.has(id)?stepPhotoPickers.delete(id):stepPhotoPickers.add(id);refreshDraftSteps();return}
   const stepPhotoSelect=e.target.closest('[data-step-existing-photo]');
   if(stepPhotoSelect&&draft){const step=draft.steps.find(s=>s.id===stepPhotoSelect.dataset.stepExistingPhoto);if(step&&draft.photos.some(p=>p.id===stepPhotoSelect.dataset.photoId))step.photoId=stepPhotoSelect.dataset.photoId;stepPhotoPickers.delete(stepPhotoSelect.dataset.stepExistingPhoto);refreshDraftSteps();return}
   const stepPhotoClear=e.target.closest('[data-step-photo-clear]');
   if(stepPhotoClear&&draft){const step=draft.steps.find(s=>s.id===stepPhotoClear.dataset.stepPhotoClear);if(step)step.photoId='';stepPhotoPickers.delete(stepPhotoClear.dataset.stepPhotoClear);refreshDraftSteps();return}
   const nav=e.target.closest('[data-nav]');if(nav){router(nav.dataset.nav);return}
  const browseTag=e.target.closest('[data-browsetag]');if(browseTag){router('recipes');tagFilter=browseTag.dataset.browsetag;renderRecipes();return}
  const browseMeal=e.target.closest('[data-browsemeal]');if(browseMeal){router('recipes');mealFilter=browseMeal.dataset.browsemeal;renderRecipes();return}
  const browseUt=e.target.closest('[data-browseutensil]');if(browseUt){router('recipes');query=browseUt.dataset.browseutensil;renderRecipes();return}
  const restoreTrash=e.target.closest('[data-restore-trash]');if(restoreTrash){const r=trashRecipes.find(r=>r.id===restoreTrash.dataset.restoreTrash);if(r){const next={...r};delete next.deletedAt;await storePut('recipes',next);await refresh();render();toast('Receta recuperada')}return}
  const removeTrash=e.target.closest('[data-permanent-trash]');if(removeTrash){const r=trashRecipes.find(r=>r.id===removeTrash.dataset.permanentTrash);if(r&&confirm(`¿Borrar definitivamente «${r.name}»? Esta acción no se puede deshacer.`)){await storeDelete('recipes',r.id);releaseImage(r.id);await refresh();render();toast('Receta borrada definitivamente')}return}
  const quickIng=e.target.closest('[data-ingredientfilter]');if(quickIng){const n=nameFor(quickIng.dataset.ingredientfilter);router('recipes');query=n;renderRecipes();return}
  const meal=e.target.closest('[data-mealfilter]');if(meal){mealFilter=meal.dataset.mealfilter;renderRecipes();return}
  const rm=e.target.closest('[data-rming]');if(rm&&draft){draft.ingredients.splice(Number(rm.dataset.rming),1);refreshDraftIngredients();return}
  const secRemove=e.target.closest('[data-remove-section]');if(secRemove&&draft){removeSection(secRemove.dataset.removeSection);return}
  const secMove=e.target.closest('[data-move-section]');if(secMove&&draft){moveItem(draft.ingredientSections,secMove.dataset.moveSection,Number(secMove.dataset.dir));refreshDraftIngredients();return}
  const stepRemove=e.target.closest('[data-remove-step]');if(stepRemove&&draft){draft.steps=draft.steps.filter(s=>s.id!==stepRemove.dataset.removeStep);stepPhotoPickers.delete(stepRemove.dataset.removeStep);refreshDraftSteps();return}
  const stepMove=e.target.closest('[data-move-step]');if(stepMove&&draft){moveItem(draft.steps,stepMove.dataset.moveStep,Number(stepMove.dataset.dir));refreshDraftSteps();return}
  const photoRemove=e.target.closest('[data-remove-photo]');if(photoRemove&&draft){draft.photos=draft.photos.filter(p=>p.id!==photoRemove.dataset.removePhoto);for(const step of draft.steps)if(step.photoId===photoRemove.dataset.removePhoto)step.photoId='';const entry=draftPhotoURLs.get(photoRemove.dataset.removePhoto);if(entry){URL.revokeObjectURL(entry.url);draftPhotoURLs.delete(photoRemove.dataset.removePhoto)}refreshDraftPhotos();refreshDraftSteps();return}
   const coverPhoto=e.target.closest('[data-cover-photo]');if(coverPhoto&&draft){const idx=draft.photos.findIndex(p=>p.id===coverPhoto.dataset.coverPhoto);if(idx>0){draft.photos.unshift(draft.photos.splice(idx,1)[0]);refreshDraftPhotos()}return}
  const viewPhoto=e.target.closest('[data-view-photo]');if(viewPhoto){openedPhotoIndex=Number(viewPhoto.dataset.viewPhoto);const r=recipes.find(x=>x.id===opened);if(r){const target=$('photoDetail');if(target)target.innerHTML=photoDetailMarkup(r)}return}
  const rmUt=e.target.closest('[data-rmutensil]');if(rmUt&&draft){draft.utensils.splice(Number(rmUt.dataset.rmutensil),1);$('utensilTags').innerHTML=utensilsMarkup();return}
  const rmTag=e.target.closest('[data-rmtag]');if(rmTag&&draft){draft.tags.splice(Number(rmTag.dataset.rmtag),1);refreshDraftTags();return}
  const tagPick=e.target.closest('[data-tagpick]');if(tagPick&&draft){draft.tags.push(tagPick.dataset.tagpick);refreshDraftTags();return}
  const toggle=e.target.closest('[data-togglemeal]');if(toggle&&draft){const m=toggle.dataset.togglemeal;draft.mealTypes=draft.mealTypes.includes(m)?draft.mealTypes.filter(x=>x!==m):[...draft.mealTypes,m];toggle.classList.toggle('active');return}
  const exist=e.target.closest('[data-addexisting]');if(exist&&draft){const item=ingredientsCatalog().find(x=>x.id===exist.dataset.addexisting);if(item)await addIngredient(item.id,null,exist.dataset.targetSection);return}
  const newer=e.target.closest('[data-addnew]');if(newer&&draft){await addIngredient(ingId(newer.dataset.addnew),newer.dataset.addnew,newer.dataset.targetSection);return}
  const typed=e.target.closest('[data-addtyped-section]');if(typed&&draft){addTypedIngredient(typed.dataset.addtypedSection);return}
  const fave=e.target.closest('[data-fave]');if(fave){await toggleFavorite(fave.dataset.fave);return}
  const op=e.target.closest('[data-action]');if(op){const action=op.dataset.action;
    if(action==='new')newDraft();if(action==='demo')await addDemo();if(action==='clearfilters'){mealFilter='Todas';tagFilter='';query='';renderRecipes()}if(action==='close')closeOverlay();if(action==='save')await saveRecipe();if(action==='addtag')addTag();if(action==='addutensil')addUtensil();if(action==='add-section')addSection();if(action==='add-step')addStep();
    if(action==='edit'){const r=recipes.find(x=>x.id===opened);if(r)newDraft(r)}if(action==='backdetail'){opened=null;render();resetRecipeScroll()}if(action==='delete')await deleteOpened();if(action==='duplicate')duplicateOpened();if(action==='increase'){openedServings=Math.min(99,openedServings+1);updateServings()}if(action==='decrease'){openedServings=Math.max(1,openedServings-1);updateServings()}if(action==='pdf')recipePdfDialog();if(action==='pdf-create')await createOpenedRecipePDF();if(action==='pdf-download')downloadReadyPDF();if(action==='pdf-share')await shareReadyPDF();if(action==='share')await shareOpenedRecipe();if(action==='importrecipe')$('importRecipeInput').click();if(action==='backup')await exportBackup();if(action==='verifybackup')$('checkBackupInput').click();if(action==='restore')$('restoreInput').click();return}
  const open=e.target.closest('[data-open]');if(open){openRecipe(open.dataset.open);return}if(e.target===$('overlay'))closeOverlay()
});
document.addEventListener('keydown',e=>{const search=e.target.closest('[data-section-search]');if(search&&e.key==='Enter'){e.preventDefault();const area=[...document.querySelectorAll('[data-suggest]')].find(x=>x.dataset.suggest===search.dataset.sectionSearch);const first=area?.classList.contains('open')?area.querySelector('button'):null;if(first)first.click();else addTypedIngredient(search.dataset.sectionSearch);return}if(e.key==='Escape'&&$('photoLightbox').classList.contains('open')){closeImageLightbox();return}if(e.key==='Escape'&&$('overlay').classList.contains('open')){closeOverlay();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openRecipe(e.target.dataset.open)}});
document.addEventListener('input',e=>{const qty=e.target.closest('[data-ingqty]');if(qty&&draft){const i=draft.ingredients[Number(qty.dataset.ingqty)];i.quantity=qty.value.trim()===''?null:Math.max(0,Number(qty.value))}const section=e.target.closest('[data-section-title]');if(section&&draft){const x=draft.ingredientSections.find(x=>x.id===section.dataset.sectionTitle);if(x)x.title=section.value}const sf=e.target.closest('[data-step-field]');if(sf&&draft&&sf.dataset.stepField!=='type'){updateStepField(sf)}const search=e.target.closest('[data-section-search]');if(search&&draft)suggestionsList(search);if(e.target.id==='recipeSearch'){query=e.target.value;updateRecipeResults()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-step-upload]')){handlePhoto(e);return}if(e.target.id==='sortFilter'){sortBy=e.target.value;renderRecipes()}if(e.target.id==='tagFilter'){tagFilter=e.target.value;renderRecipes()}const unit=e.target.closest('[data-ingunit]');if(unit&&draft){const ing=draft.ingredients[Number(unit.dataset.ingunit)];ing.unit=unit.value;if(unit.value==='al gusto')ing.quantity=null;refreshDraftIngredients()}const sf=e.target.closest('[data-step-field]');if(sf&&draft&&['type','method','heat','photoId'].includes(sf.dataset.stepField))updateStepField(sf)});
$('restoreInput').addEventListener('change',restoreBackup);
$('checkBackupInput').addEventListener('change',verifyBackupFile);
$('importRecipeInput').addEventListener('change',importSharedRecipe);
(async()=>{try{db=await openDB();await refresh();render()}catch(err){console.error(err);$('main').innerHTML=`<div class="empty"><h2>No se pudo abrir el almacenamiento local</h2><p>Prueba a abrir el HTML desde un navegador convencional con almacenamiento habilitado. Para uso en iPhone, es preferible alojar la aplicación en una dirección HTTPS.</p></div>`}})();

</script>

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Sin modo offline instalado:',e)));
}
