<script>

'use strict';
const ICONS={book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>',heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>',leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M20 4c-9 0-16 2-16 10a6 6 0 0 0 6 6c8 0 10-7 10-16Z"/><path d="M4 20c3-6 7-10 13-13"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 1 1.8-2 2-1.8-1-2 1-1 2.2h-2.8l-1-2.2-2-1-1.8 1-2-2 1-1.8-1-2-2.2-1v-2.8l2.2-1 1-2-1-1.8 2-2 1.8 1 2-1 1-2.2h2.8l1 2.2 2 1 1.8-1 2 2-1 1.8 1 2 2.2 1v2.8l-2.2 1Z"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3h12l4 4v14H3V3h2Z"/><path d="M7 3v7h10V3M7 21v-8h10v8"/></svg>'};
const MEALS=['Desayuno','Comida','Merienda','Cena'];
const DEFAULT_INGREDIENTS=['Aceite de oliva','Aceite de girasol','Agua','Aguacate','Ajo','Albahaca','Almendras','Arroz','Atún','Avena','Azúcar','Bacon','Berenjena','Brócoli','Cacao','Calabacín','Calabaza','Canela','Carne picada','Cebolla','Champiñones','Chocolate','Cilantro','Coliflor','Comino','Espárragos','Espinacas','Fresas','Garbanzos','Guisantes','Harina de trigo','Huevo','Jamón cocido','Jamón serrano','Judías verdes','Kiwi','Leche','Lechuga','Lentejas','Limón','Macarrones','Mantequilla','Manzana','Mayonesa','Miel','Mozzarella','Nata para cocinar','Nueces','Orégano','Pan','Pan integral','Patata','Pechuga de pollo','Perejil','Pimentón','Pimienta negra','Pimiento rojo','Pimiento verde','Puerro','Queso fresco','Queso rallado','Quinoa','Sal','Salmón','Salsa de soja','Sésamo','Sofrito de tomate','Tomate','Tomate triturado','Tortilla de trigo','Yogur natural','Zanahoria','Zumo de limón'];
const UNITS=[['g','g'],['kg','kg'],['ml','ml'],['l','l'],['ud','ud.'],['cda','cda.'],['cdta','cdta.'],['taza','taza'],['pizca','pizca'],['al gusto','al gusto']];
const now=()=>new Date().toISOString();
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const ingId=name=>'ing-'+norm(name).replace(/[^a-z0-9 ]/g,'').replace(/ /g,'-');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const plural=(n,sing,plur)=>n===1?sing:plur;
const fmt=n=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:2});
const btn=(text,fn,kind='secondary')=>`<button type="button" class="btn ${kind}" data-action="${fn}">${text}</button>`;
let db,recipes=[],customIngredients=[],tab='recipes',mealFilter='Todas',tagFilter='',query='',sortBy='recent',draft=null,opened=null,openedServings=2,openedPhotoIndex=0,searchTimer=null,photoProcessing=false;
const picURLs=new Map();
function recipePhotos(r){return Array.isArray(r.photos)&&r.photos.length?r.photos:(r.photo?[{id:'legacy',photo:r.photo,photoThumb:r.photoThumb||null,info:r.photoInfo||null}]:[])}
function imageURL(r,small=false,index=0){const p=recipePhotos(r)[index]||recipePhotos(r)[0];if(!p)return null;const blob=(small&&p.photoThumb)||p.photo;if(!blob)return null;const key=r.id+'#'+p.id+(small?'#thumb':'#photo');let a=picURLs.get(key);if(a&&a.blob===blob)return a.url;if(a)URL.revokeObjectURL(a.url);const url=URL.createObjectURL(blob);picURLs.set(key,{blob,url});return url}
function releaseImage(id){for(const key of [...picURLs.keys()]){if(key.startsWith(id+'#')){URL.revokeObjectURL(picURLs.get(key).url);picURLs.delete(key)}}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),3200)}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('mi-recetario-v1',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('recipes'))d.createObjectStore('recipes',{keyPath:'id'});if(!d.objectStoreNames.contains('ingredients'))d.createObjectStore('ingredients',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function storeAll(name){return new Promise((res,rej)=>{const tx=db.transaction(name,'readonly');const req=tx.objectStore(name).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function storePut(name,item){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).put(item);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function storeDelete(name,id){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function refresh(){recipes=await storeAll('recipes');customIngredients=await storeAll('ingredients')}
function ingredientsCatalog(){const seen=new Map();for(const n of DEFAULT_INGREDIENTS){seen.set(norm(n),{id:ingId(n),name:n})}for(const x of customIngredients)seen.set(norm(x.name),x);return Array.from(seen.values())}
function nameFor(id){return ingredientsCatalog().find(x=>x.id===id)?.name||'Ingrediente desconocido'}
function usageFor(id){return recipes.reduce((a,r)=>a+(r.ingredients||[]).filter(i=>i.ingredientId===id).length,0)}
const demoData=[{name:'Arroz con pollo y verduras',mealTypes:['Comida','Cena'],tags:['Casera','Para repetir'],servings:2,ingredients:[['Arroz',150,'g'],['Pechuga de pollo',250,'g'],['Pimiento rojo',1,'ud'],['Cebolla',0.5,'ud'],['Aceite de oliva',2,'cda']],instructions:'Sofreír la cebolla y el pimiento. Añadir el pollo troceado y dorar. Incorporar el arroz y el agua; cocinar hasta que esté en su punto.',emoji:'🍚'},{name:'Tostada de aguacate y huevo',mealTypes:['Desayuno','Merienda'],tags:['Rápida'],servings:1,ingredients:[['Pan integral',2,'ud'],['Aguacate',0.5,'ud'],['Huevo',1,'ud']],instructions:'Tostar el pan, machacar el aguacate y colocar encima el huevo cocinado al gusto.',emoji:'🥑'},{name:'Salmón al horno con patata',mealTypes:['Comida','Cena'],tags:['Horno','Favorita'],servings:2,ingredients:[['Salmón',300,'g'],['Patata',250,'g'],['Limón',0.5,'ud'],['Aceite de oliva',1,'cda']],instructions:'Hornear la patata en rodajas. Añadir el salmón con limón y terminar la cocción.',emoji:'🐟'}];
async function addDemo(){if(!confirm('¿Añadir tres recetas de ejemplo para probar los filtros? Puedes eliminarlas cuando quieras.'))return;for(const t of demoData){const x={id:uid(),name:t.name,mealTypes:t.mealTypes,tags:t.tags,servings:t.servings,ingredients:t.ingredients.map(a=>({ingredientId:ingId(a[0]),quantity:a[1],unit:a[2]})),instructions:t.instructions,notes:'Receta de demostración',favorite:false,photo:null,emoji:t.emoji,createdAt:now(),updatedAt:now(),demo:true};await storePut('recipes',x)}await refresh();render();toast('3 recetas de ejemplo añadidas')}
const NAV=[['recipes','Mis recetas','book'],['favorites','Favoritas','heart'],['ingredients','Ingredientes','leaf'],['settings','Configuración','settings']];
function renderNav(){for(const [id,element] of [['desktopNav',false],['mobileNav',true]]){$(id).innerHTML=NAV.map(([t,label,ico])=>`<button class="${tab===t?'active':''}" data-nav="${t}">${ICONS[ico]}<span>${label}</span></button>`).join('')}}
function header(k,title,sub,showAdd=true){return `<div class="topbar"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(title)}</h1><p class="subheadline">${esc(sub)}</p></div>${showAdd?btn(ICONS.plus+' <span>Añadir receta</span>','new','primary'):''}</div>`}
function recipeFiltered(){let out=recipes.filter(r=>tab!=='favorites'||r.favorite);if(mealFilter!=='Todas')out=out.filter(r=>(r.mealTypes||[]).includes(mealFilter));if(tagFilter)out=out.filter(r=>(r.tags||[]).some(t=>norm(t)===norm(tagFilter)));if(query.trim()){const term=norm(query);out=out.filter(r=>[r.name,...(r.tags||[]),...(r.ingredients||[]).map(i=>nameFor(i.ingredientId))].some(s=>norm(s).includes(term)))}out.sort((a,b)=>sortBy==='az'?a.name.localeCompare(b.name,'es'):sortBy==='old'?new Date(a.createdAt)-new Date(b.createdAt):new Date(b.updatedAt)-new Date(a.updatedAt));return out}
function allTags(){return [...new Set(recipes.flatMap(r=>r.tags||[]))].sort((a,b)=>a.localeCompare(b,'es'))}
function card(r){const src=imageURL(r,true);const d=(r.mealTypes||[]).slice(0,2);return `<article class="recipe-card" data-open="${esc(r.id)}" tabindex="0" role="button" aria-label="Abrir receta ${esc(r.name)}"><div class="card-img">${src?`<img src="${esc(src)}" alt="Fotografía de ${esc(r.name)}"/>`:`<span class="card-emoji">${esc(r.emoji||'🍽️')}</span>`}<button aria-label="${r.favorite?'Quitar de favoritos':'Añadir a favoritos'}" class="fave ${r.favorite?'active':''}" data-fave="${esc(r.id)}" title="Favorito">♥</button></div><div class="card-body"><h3>${esc(r.name)}</h3><div class="badges">${d.map(t=>`<span class="mini-badge">${esc(t)}</span>`).join('')}${(r.tags||[]).slice(0,1).map(t=>`<span class="mini-badge alt">${esc(t)}</span>`).join('')}</div><div class="card-foot"><span>♧ ${(r.ingredients||[]).length} ingredientes</span><span>◉ ${esc(r.servings)} ${plural(r.servings,'ración','raciones')}</span></div></div></article>`}
function renderRecipes(){const results=recipeFiltered(),tags=allTags();$('main').innerHTML=header('Hecho en casa',tab==='favorites'?'Tus favoritas':'Tu cocina, tus recetas',tab==='favorites'?'Esas recetas a las que siempre vuelves.':'Todo lo que cocinas y quieres recordar, en un solo lugar.')+(tab==='recipes'?`<div class="summary"><div class="stat"><div><strong class="num">${recipes.length}</strong><span class="stat-lab">Recetas guardadas</span></div><span class="sicon">📖</span></div><div class="stat"><div><strong class="num">${recipes.filter(x=>x.favorite).length}</strong><span class="stat-lab">Favoritas</span></div><span class="sicon">♡</span></div><div class="stat"><div><strong class="num">${new Set(recipes.flatMap(r=>(r.ingredients||[]).map(i=>i.ingredientId))).size}</strong><span class="stat-lab">Ingredientes usados</span></div><span class="sicon">🌿</span></div></div>`:'')+`<div class="controls"><label class="search"><span class="si">${ICONS.search}</span><input id="recipeSearch" value="${esc(query)}" placeholder="Buscar plato, ingrediente o etiqueta..." autocomplete="off" aria-label="Buscar recetas"/></label><select class="filter" id="sortFilter"><option value="recent" ${sortBy==='recent'?'selected':''}>Más recientes</option><option value="az" ${sortBy==='az'?'selected':''}>Nombre A-Z</option><option value="old" ${sortBy==='old'?'selected':''}>Más antiguas</option></select></div><div class="chipbar">${['Todas',...MEALS].map(m=>`<button class="chip ${mealFilter===m?'active':''}" data-mealfilter="${m}">${m}</button>`).join('')}</div><div class="microfilters"><div class="tiny" id="resultCount">${results.length} ${plural(results.length,'receta encontrada','recetas encontradas')}</div><select class="filter" id="tagFilter"><option value="">Todas las etiquetas</option>${tags.map(t=>`<option value="${esc(t)}" ${tagFilter===t?'selected':''}># ${esc(t)}</option>`).join('')}</select></div><div id="recipeResults">${results.length?`<div class="recipe-grid">${results.map(card).join('')}</div>`:emptyRecipes()}</div>`}
function emptyRecipes(){const newUser=recipes.length===0;return `<div class="empty"><div class="ill">${newUser?'🍳':'🔎'}</div><h2>${newUser?'Tu próximo plato tiene sitio aquí':'No hemos encontrado recetas'}</h2><p>${newUser?'Empieza con una fotografía, un nombre y los ingredientes. Puedes completar la receta después.':'Prueba con otro nombre, ingrediente, categoría o etiqueta.'}</p>${newUser?`${btn('+ Añadir mi primera receta','new','primary')} <button class="btn outline" data-action="demo">Ver recetas de ejemplo</button>`:`<button class="btn secondary" data-action="clearfilters">Limpiar filtros</button>`}</div>`}
function updateRecipeResults(){if(tab!=='recipes'&&tab!=='favorites')return;const results=recipeFiltered();$('resultCount').textContent=`${results.length} ${plural(results.length,'receta encontrada','recetas encontradas')}`;$('recipeResults').innerHTML=results.length?`<div class="recipe-grid">${results.map(card).join('')}</div>`:emptyRecipes()}
function renderIngredients(){const used=new Set(recipes.flatMap(r=>(r.ingredients||[]).map(i=>i.ingredientId)));const sorted=ingredientsCatalog().filter(i=>used.has(i.id)||customIngredients.some(x=>x.id===i.id)).sort((a,b)=>a.name.localeCompare(b.name,'es'));$('main').innerHTML=header('Tu despensa digital','Ingredientes','Un mismo ingrediente puede estar presente en muchas recetas.',false)+`<div class="panel"><h3>Catálogo único</h3><p>El buscador sugiere ingredientes comunes. Cuando creas uno nuevo, conserva una identidad propia y puedes utilizarlo en cualquier receta.</p><p class="tiny">${sorted.length} ingredientes registrados o utilizados · ${used.size} presentes en recetas</p></div><div class="list-ingredients">${sorted.length?sorted.map(i=>`<button class="ing-tile" data-ingredientfilter="${esc(i.id)}" title="Ver recetas que usan ${esc(i.name)}" style="text-align:left;cursor:pointer"><span>${esc(i.name)}</span><span class="ing-count">${usageFor(i.id)} ${plural(usageFor(i.id),'receta','recetas')} ↗</span></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Aún no hay ingredientes utilizados. Añádelos al crear recetas.</div>'}</div>`}
function renderSettings(){$('main').innerHTML=header('Tus datos','Configuración','Controla tus recetas y conserva una copia de seguridad.',false)+`<div class="panel"><h2>Almacenamiento</h2><div class="callout"><strong>Datos locales, sin sincronización activa.</strong><br>Esta versión todavía <strong>no sincroniza automáticamente</strong> con iCloud ni otros dispositivos. No la utilices aún como único lugar para un recetario valioso.</div><p style="margin-top:17px">Exporta todas las recetas, secciones, pasos, ingredientes y fotografías a un archivo JSON para guardarlo en Drive o iCloud Drive.</p><div class="setting-actions">${btn('↓ Exportar copia completa','backup','primary')}${btn('↑ Restaurar copia','restore','outline')}</div><p class="tiny">Se pueden importar copias de Mi Recetario 1.0 y 1.1. Antes de cambiar de versión, exporta tus datos.</p></div><div class="panel"><h2>Fotografías optimizadas</h2><p>Las fotografías se comprimen automáticamente a un objetivo aproximado de 150 KB cada una, con resolución inicial de hasta 1200 px y miniaturas. Ahora puedes añadir varias fotografías por receta y elegir la principal.</p></div><div class="panel"><h2>Probar el diseño</h2><p>Añade tres recetas de ejemplo para comprobar los filtros, cantidades y búsquedas.</p>${btn('+ Añadir 3 recetas de ejemplo','demo','secondary')}</div><div class="panel"><h2>Próxima conexión a la nube</h2><p>La estructura está preparada para la futura sincronización gratuita, con separación de recetas, secciones, pasos, ingredientes e imágenes.</p></div><p class="version">Mi Recetario · Prototipo v1.2 · Secciones, pasos y múltiples fotos · Guardado local IndexedDB</p>`}
function render(){renderNav();if(tab==='ingredients')renderIngredients();else if(tab==='settings')renderSettings();else renderRecipes()}
function openOverlay(html){$('overlay').innerHTML=html;$('overlay').classList.add('open');document.body.style.overflow='hidden'}
function closeOverlay(){releaseDraftPhotos();$('overlay').classList.remove('open');$('overlay').innerHTML='';document.body.style.overflow='';opened=null;draft=null}
function overlayHeader(title,extra=''){return `<div class="sheet-top"><span class="sheet-head">${esc(title)}</span><span style="display:flex;gap:8px">${extra}<button class="close" data-action="close" aria-label="Cerrar">×</button></span></div>`}
const draftPhotoURLs=new Map();
function photoDraftURL(p){const key=p.id;const entry=draftPhotoURLs.get(key);if(entry&&entry.blob===p.photo)return entry.url;if(entry)URL.revokeObjectURL(entry.url);const url=URL.createObjectURL(p.photo);draftPhotoURLs.set(key,{url,blob:p.photo});return url}
function releaseDraftPhotos(){for(const x of draftPhotoURLs.values())URL.revokeObjectURL(x.url);draftPhotoURLs.clear()}
function normalizeDraft(recipe){
  const sections=Array.isArray(recipe.ingredientSections)&&recipe.ingredientSections.length?recipe.ingredientSections.map(x=>({...x})):[{id:'base',title:'Ingredientes'}];
  const first=sections[0].id;
  const steps=Array.isArray(recipe.steps)?recipe.steps.map(s=>({...s,id:s.id||uid(),type:s.type==='cooking'?'cooking':'preparation'})):(recipe.instructions?.trim()?[{id:uid(),type:'preparation',text:recipe.instructions,durationMinutes:null,tempC:null,notes:''}]:[]);
  return {...recipe,ingredientSections:sections,ingredients:(recipe.ingredients||[]).map(i=>({...i,sectionId:i.sectionId||first})),steps,photos:recipePhotos(recipe).map(p=>({...p,id:p.id==='legacy'?uid():p.id})),photo:null,photoThumb:null,photoInfo:null,mealTypes:[...(recipe.mealTypes||[])],tags:[...(recipe.tags||[])]};
}
function newDraft(recipe=null){releaseDraftPhotos();draft=recipe?normalizeDraft(recipe):{id:uid(),name:'',photos:[],servings:2,ingredientSections:[{id:'base',title:'Ingredientes'}],ingredients:[],steps:[],mealTypes:['Comida'],tags:[],instructions:'',notes:'',favorite:false,createdAt:now(),updatedAt:now()};renderEditor()}
function photoEditorMarkup(){return `<div class="photos-editor"><label class="add-multi-photo"><span>＋ 📷 Añadir fotografías</span><small>Selecciona una o varias · Se optimizan automáticamente (~150 KB cada una)</small><input type="file" id="photoInput" accept="image/*" multiple aria-label="Añadir fotografías del plato"></label><div class="photo-thumbs" id="photoThumbs">${draft.photos.map((p,i)=>`<div class="photo-thumb"><img src="${esc(photoDraftURL(p))}" alt="Foto ${i+1}"><span class="photo-number">${i===0?'Principal':`Foto ${i+1}`}</span><div class="photo-tools">${i>0?`<button type="button" data-cover-photo="${esc(p.id)}" title="Elegir como portada" aria-label="Usar foto ${i+1} como portada">★</button>`:'<span class="cover-star" title="Portada">★</span>'}<button type="button" data-remove-photo="${esc(p.id)}" aria-label="Quitar foto ${i+1}" title="Eliminar fotografía">×</button></div></div>`).join('')}</div>${draft.photos.length?`<p class="tiny" style="margin:10px 0 0">${draft.photos.length} ${plural(draft.photos.length,'fotografía','fotografías')}. Pulsa ★ para elegir la portada.</p>`:''}</div>`}
function ingredientGroupMarkup(section){const si=draft.ingredientSections.findIndex(s=>s.id===section.id),items=draft.ingredients.map((x,i)=>({...x,_index:i})).filter(x=>x.sectionId===section.id);return `<div class="group-card"><div class="group-head"><span class="group-count">Sección ${si+1}</span><div class="mini-tools">${si>0?`<button data-move-section="${esc(section.id)}" data-dir="-1" title="Subir sección">↑</button>`:''}${si<draft.ingredientSections.length-1?`<button data-move-section="${esc(section.id)}" data-dir="1" title="Bajar sección">↓</button>`:''}${draft.ingredientSections.length>1?`<button data-remove-section="${esc(section.id)}" title="Eliminar sección">×</button>`:''}</div></div><input class="text-input section-name" aria-label="Nombre de sección" data-section-title="${esc(section.id)}" maxlength="65" value="${esc(section.title)}" placeholder="Ej. Masa, relleno, cobertura..."/><div class="ing-lines">${items.length?items.map(item=>`<div class="ing-line"><div class="ing-name" title="${esc(nameFor(item.ingredientId))}">${esc(nameFor(item.ingredientId))}</div><input type="number" min="0" step="any" inputmode="decimal" data-ingqty="${item._index}" aria-label="Cantidad de ${esc(nameFor(item.ingredientId))}" value="${item.quantity??''}" placeholder="Cant."/><select data-ingunit="${item._index}" aria-label="Unidad de ${esc(nameFor(item.ingredientId))}">${UNITS.map(([id,title])=>`<option value="${esc(id)}" ${id===item.unit?'selected':''}>${esc(title)}</option>`).join('')}</select><button class="icon-btn" data-rming="${item._index}" aria-label="Quitar ${esc(nameFor(item.ingredientId))}">×</button></div>`).join(''):'<p class="tiny">Todavía no hay ingredientes en esta sección.</p>'}</div><div class="ingredient-add"><div class="ingredient-search-wrap"><input class="text-input" data-section-search="${esc(section.id)}" placeholder="Buscar ingrediente..." autocomplete="off" aria-label="Buscar ingrediente para ${esc(section.title)}"/><div class="suggestions" data-suggest="${esc(section.id)}"></div></div><button class="btn secondary" data-addtyped-section="${esc(section.id)}" type="button">Añadir</button></div></div>`}
function groupsMarkup(){return draft.ingredientSections.map(ingredientGroupMarkup).join('')}

function loadImageForCompression(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Formato no compatible. Convierte la foto a JPEG o PNG.'))};img.src=url})}
async function compressPhoto(file){
  if(file.size>35*1024*1024)throw new Error('La fotografía es demasiado grande (máximo 35 MB)');
  const img=await loadImageForCompression(file);
  const maxOriginal=Math.max(img.naturalWidth,img.naturalHeight);
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx)throw new Error('No hay procesador gráfico disponible');
  const suitableWebp=await (async()=>{canvas.width=2;canvas.height=2;try{const b=await canvasBlob(canvas,'image/webp',.80);return b.type==='image/webp'}catch(_){return false}})();
  const mime=suitableWebp?'image/webp':'image/jpeg';
  let best=null;
  const stages=[1200,1120,1024,960,880,800];
  // Search sensible visual qualities; target is approximate, not a hard cap.
  for(const edge of stages){
    const size=Math.min(edge,maxOriginal);
    const scale=size/maxOriginal;
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

      const blob=await canvasBlob(canvas,mime,quality);
      if(!best||blob.size<best.blob.size)best={blob,width:canvas.width,height:canvas.height,mime,quality};
      if(blob.size<=PHOTO_TARGET_BYTES){best={blob,width:canvas.width,height:canvas.height,mime,quality};break}
    }
    if(best.blob.size<=PHOTO_TARGET_BYTES)break;
  }

  const thumbScale=Math.min(1,320/maxOriginal);

  canvas.height=Math.max(1,Math.round(img.naturalHeight*thumbScale));
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const thumb=await canvasBlob(canvas,mime,.70);
  return {photo:best.blob,photoThumb:thumb,info:{originalBytes:file.size,optimizedBytes:best.blob.size,thumbBytes:thumb.size,width:best.width,height:best.height,format:best.mime.split('/')[1],targetMet:best.blob.size<=PHOTO_TARGET_BYTES}};
}

function fromDataURL(data){if(typeof data!=='string'||!/^data:image\/(jpeg|png|webp);base64,/.test(data))return null;const i=data.indexOf(',');const mime=data.substring(5,data.indexOf(';'));const raw=atob(data.slice(i+1));const a=new Uint8Array(raw.length);for(let k=0;k<raw.length;k++)a[k]=raw.charCodeAt(k);return new Blob([a],{type:mime})}
async function exportBackup(){try{toast('Preparando copia completa…');const exported=await Promise.all(recipes.map(async r=>({...r,photo:r.photo?await toDataURL(r.photo):null,photoThumb:r.photoThumb?await toDataURL(r.photoThumb):null,photos:await Promise.all((r.photos||[]).map(async p=>({...p,photo:p.photo?await toDataURL(p.photo):null,photoThumb:p.photoThumb?await toDataURL(p.photoThumb):null})))})));const payload={format:'mi-recetario',schemaVersion:3,exportedAt:now(),recipes:exported,ingredients:customIngredients};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-recetario-copia-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast(`Copia creada: ${recipes.length} recetas, secciones, pasos y fotografías`)}catch(e){console.error(e);toast('No se pudo exportar la copia')}}
async function restoreBackup(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>250*1024*1024){toast('La copia es demasiado grande para restaurarla aquí');return}let payload;try{payload=JSON.parse(await file.text());if(payload.format!=='mi-recetario'||![1,2,3].includes(payload.schemaVersion)||!Array.isArray(payload.recipes)||!Array.isArray(payload.ingredients))throw Error('Formato inválido');if(payload.recipes.some(r=>!r.id||typeof r.name!=='string'||!Array.isArray(r.ingredients)))throw Error('Contenido inválido')}catch(err){toast('El archivo no es una copia válida de Mi Recetario');return}if(!confirm(`¿Restaurar ${payload.recipes.length} recetas? Se SUSTITUIRÁN las recetas actuales de este navegador. Exporta antes una copia de seguridad.`))return;try{const restored=payload.recipes.map(r=>({...r,photo:r.photo?fromDataURL(r.photo):null,photoThumb:r.photoThumb?fromDataURL(r.photoThumb):null,photos:Array.isArray(r.photos)?r.photos.map(p=>({...p,photo:fromDataURL(p.photo),photoThumb:fromDataURL(p.photoThumb)})):undefined}));await new Promise((res,rej)=>{const tx=db.transaction(['recipes','ingredients'],'readwrite');tx.objectStore('recipes').clear();tx.objectStore('ingredients').clear();for(const r of restored)tx.objectStore('recipes').put(r);for(const ing of payload.ingredients)if(ing.id&&ing.name)tx.objectStore('ingredients').put(ing);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});for(const a of picURLs.values())URL.revokeObjectURL(a.url);picURLs.clear();await refresh();render();toast(`${restored.length} recetas restauradas correctamente`)}catch(err){console.error(err);toast('No se pudo completar la restauración')}}
function router(tabName){tab=tabName;mealFilter='Todas';tagFilter='';query='';window.scrollTo({top:0,behavior:'smooth'});render()}
document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-nav]');if(nav){router(nav.dataset.nav);return}
  const quickIng=e.target.closest('[data-ingredientfilter]');if(quickIng){const n=nameFor(quickIng.dataset.ingredientfilter);router('recipes');query=n;renderRecipes();return}
  const meal=e.target.closest('[data-mealfilter]');if(meal){mealFilter=meal.dataset.mealfilter;renderRecipes();return}
  const rm=e.target.closest('[data-rming]');if(rm&&draft){draft.ingredients.splice(Number(rm.dataset.rming),1);refreshDraftIngredients();return}
  const secRemove=e.target.closest('[data-remove-section]');if(secRemove&&draft){removeSection(secRemove.dataset.removeSection);return}
  const secMove=e.target.closest('[data-move-section]');if(secMove&&draft){moveItem(draft.ingredientSections,secMove.dataset.moveSection,Number(secMove.dataset.dir));refreshDraftIngredients();return}
  const stepRemove=e.target.closest('[data-remove-step]');if(stepRemove&&draft){draft.steps=draft.steps.filter(s=>s.id!==stepRemove.dataset.removeStep);refreshDraftSteps();return}
  const stepMove=e.target.closest('[data-move-step]');if(stepMove&&draft){moveItem(draft.steps,stepMove.dataset.moveStep,Number(stepMove.dataset.dir));refreshDraftSteps();return}
  const photoRemove=e.target.closest('[data-remove-photo]');if(photoRemove&&draft){draft.photos=draft.photos.filter(p=>p.id!==photoRemove.dataset.removePhoto);const entry=draftPhotoURLs.get(photoRemove.dataset.removePhoto);if(entry){URL.revokeObjectURL(entry.url);draftPhotoURLs.delete(photoRemove.dataset.removePhoto)}refreshDraftPhotos();return}
  const coverPhoto=e.target.closest('[data-cover-photo]');if(coverPhoto&&draft){const idx=draft.photos.findIndex(p=>p.id===coverPhoto.dataset.coverPhoto);if(idx>0){draft.photos.unshift(draft.photos.splice(idx,1)[0]);refreshDraftPhotos()}return}
  const viewPhoto=e.target.closest('[data-view-photo]');if(viewPhoto){openedPhotoIndex=Number(viewPhoto.dataset.viewPhoto);const r=recipes.find(x=>x.id===opened);if(r){const target=$('photoDetail');if(target)target.innerHTML=photoDetailMarkup(r)}return}
  const rmTag=e.target.closest('[data-rmtag]');if(rmTag&&draft){draft.tags.splice(Number(rmTag.dataset.rmtag),1);refreshDraftTags();return}
  const tagPick=e.target.closest('[data-tagpick]');if(tagPick&&draft){draft.tags.push(tagPick.dataset.tagpick);refreshDraftTags();return}
  const toggle=e.target.closest('[data-togglemeal]');if(toggle&&draft){const m=toggle.dataset.togglemeal;draft.mealTypes=draft.mealTypes.includes(m)?draft.mealTypes.filter(x=>x!==m):[...draft.mealTypes,m];toggle.classList.toggle('active');return}
  const exist=e.target.closest('[data-addexisting]');if(exist&&draft){const item=ingredientsCatalog().find(x=>x.id===exist.dataset.addexisting);if(item)await addIngredient(item.id,null,exist.dataset.targetSection);return}
  const newer=e.target.closest('[data-addnew]');if(newer&&draft){await addIngredient(ingId(newer.dataset.addnew),newer.dataset.addnew,newer.dataset.targetSection);return}
  const typed=e.target.closest('[data-addtyped-section]');if(typed&&draft){addTypedIngredient(typed.dataset.addtypedSection);return}
  const fave=e.target.closest('[data-fave]');if(fave){await toggleFavorite(fave.dataset.fave);return}
  const op=e.target.closest('[data-action]');if(op){const action=op.dataset.action;
    if(action==='new')newDraft();if(action==='demo')await addDemo();if(action==='clearfilters'){mealFilter='Todas';tagFilter='';query='';renderRecipes()}if(action==='close')closeOverlay();if(action==='save')await saveRecipe();if(action==='addtag')addTag();if(action==='add-section')addSection();if(action==='add-step')addStep();
    if(action==='edit'){const r=recipes.find(x=>x.id===opened);if(r){opened=null;newDraft(r)}}if(action==='delete')await deleteOpened();if(action==='duplicate')duplicateOpened();if(action==='increase'){openedServings=Math.min(99,openedServings+1);updateServings()}if(action==='decrease'){openedServings=Math.max(1,openedServings-1);updateServings()}if(action==='backup')await exportBackup();if(action==='restore')$('restoreInput').click();return}
  const open=e.target.closest('[data-open]');if(open){openRecipe(open.dataset.open);return}if(e.target===$('overlay'))closeOverlay()
});
document.addEventListener('keydown',e=>{const search=e.target.closest('[data-section-search]');if(search&&e.key==='Enter'){e.preventDefault();const area=[...document.querySelectorAll('[data-suggest]')].find(x=>x.dataset.suggest===search.dataset.sectionSearch);const first=area?.classList.contains('open')?area.querySelector('button'):null;if(first)first.click();else addTypedIngredient(search.dataset.sectionSearch);return}if(e.key==='Escape'&&$('overlay').classList.contains('open'))closeOverlay();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openRecipe(e.target.dataset.open)}});
document.addEventListener('input',e=>{const qty=e.target.closest('[data-ingqty]');if(qty&&draft){const i=draft.ingredients[Number(qty.dataset.ingqty)];i.quantity=qty.value.trim()===''?null:Math.max(0,Number(qty.value))}const section=e.target.closest('[data-section-title]');if(section&&draft){const x=draft.ingredientSections.find(x=>x.id===section.dataset.sectionTitle);if(x)x.title=section.value}const sf=e.target.closest('[data-step-field]');if(sf&&draft&&sf.dataset.stepField!=='type'){updateStepField(sf)}const search=e.target.closest('[data-section-search]');if(search&&draft)suggestionsList(search);if(e.target.id==='recipeSearch'){query=e.target.value;updateRecipeResults()}});
document.addEventListener('change',e=>{if(e.target.id==='sortFilter'){sortBy=e.target.value;renderRecipes()}if(e.target.id==='tagFilter'){tagFilter=e.target.value;renderRecipes()}const unit=e.target.closest('[data-ingunit]');if(unit&&draft){const ing=draft.ingredients[Number(unit.dataset.ingunit)];ing.unit=unit.value;if(unit.value==='al gusto')ing.quantity=null;refreshDraftIngredients()}const sf=e.target.closest('[data-step-field]');if(sf&&draft&&sf.dataset.stepField==='type')updateStepField(sf)});
$('restoreInput').addEventListener('change',restoreBackup);
(async()=>{try{db=await openDB();await refresh();render()}catch(err){console.error(err);$('main').innerHTML=`<div class="empty"><h2>No se pudo abrir el almacenamiento local</h2><p>Prueba a abrir el HTML desde un navegador convencional con almacenamiento habilitado. Para uso en iPhone, es preferible alojar la aplicación en una dirección HTTPS.</p></div>`}})();

</script>

<script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Sin modo offline instalado:',e)));
}
</script>
